<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1B3A2F">
<title>SAO CAFE — ระบบ POS ร้านกาแฟ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SAO CAFE POS v2 — Design Tokens (60-30-10, 8pt grid)
   ============================================================ */
:root{
  --green:#1B3A2F; --green-dark:#0F2419; --gold:#A67C3D; --gold-light:#C9A55C;
  --cream:#F5F0E6; --surface:#FFFFFF; --surface-2:#FBF8F1;
  --text:#2A2A24; --muted:#8A8576; --line:#E6DFD0;
  --success:#3E7C4F; --warn:#D9962B; --danger:#B33A3A;
  --shadow:0 1px 2px rgba(27,58,47,.04),0 3px 10px rgba(27,58,47,.07); --shadow-lg:0 6px 16px rgba(27,58,47,.10),0 16px 40px rgba(27,58,47,.16);
  --ring:0 0 0 3px rgba(166,124,61,.22);
  --r-card:18px; --r-btn:12px; --ease:cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --green:#163026; --green-dark:#0C1C14; --gold:#C9A55C; --gold-light:#D8BC7A;
  --cream:#14110C; --surface:#211C15; --surface-2:#1A1610;
  --text:#EDE6D6; --muted:#9A9382; --line:#352E22;
  --shadow:0 2px 12px rgba(0,0,0,.4); --shadow-lg:0 8px 28px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Prompt',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--cream);color:var(--text);height:100vh;overflow:hidden;transition:background .25s var(--ease),color .25s var(--ease)}
.app{display:flex;flex-direction:column;height:100vh}
button{font-family:'Prompt';cursor:pointer;border:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---------- Header ---------- */
header{background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;flex-shrink:0;box-shadow:0 2px 12px rgba(27,58,47,.25);z-index:56}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;letter-spacing:1px}
.logo small{display:block;font-family:'Prompt';font-size:12px;letter-spacing:4px;color:var(--gold-light);font-weight:400;text-align:center;margin-top:-2px}
nav{display:flex;gap:4px;flex-wrap:wrap}
.nav-btn{background:rgba(255,255,255,.08);color:#cfd8d0;padding:9px 14px;border-radius:11px;font-size:13px;font-weight:500;transition:.15s var(--ease);display:flex;align-items:center;gap:6px}
.nav-btn:hover{background:rgba(255,255,255,.16);color:#fff}
.nav-btn.active{background:var(--gold);color:#fff;box-shadow:0 3px 10px rgba(166,124,61,.4)}
.nav-btn .bdg{background:var(--danger);color:#fff;border-radius:10px;font-size:10px;padding:0 6px;min-width:16px;text-align:center}
.hdr-right{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--gold-light)}
.clock{font-variant-numeric:tabular-nums}
.staff-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);padding:5px 11px;border-radius:20px;color:#fff;font-size:12px}
.staff-chip .av{width:22px;height:22px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.ham-btn{display:none;position:relative;background:rgba(255,255,255,.1);color:#fff;font-size:20px;width:40px;height:40px;border-radius:10px;align-items:center;justify-content:center;flex-shrink:0}
.ham-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.cart-fab{display:none;position:relative;background:var(--gold);color:#fff;font-size:18px;width:42px;height:42px;border-radius:12px;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(166,124,61,.4)}
.cfab-badge{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.drawer-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:55}

/* ---------- Views ---------- */
.view{flex:1;overflow:hidden;display:none}
.view.active{display:flex}

/* ---------- POS ---------- */
.menu-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.pos-top{display:flex;gap:10px;align-items:center;padding:12px 16px 6px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:24px;padding:9px 16px;box-shadow:var(--shadow)}
.search input{flex:1;border:none;background:none;font-size:14px;color:var(--text);outline:none}
.otype{display:flex;gap:4px;background:var(--surface);border-radius:22px;padding:4px;box-shadow:var(--shadow)}
.otype button{padding:6px 12px;border-radius:18px;font-size:12px;font-weight:500;background:none;color:var(--muted)}
.otype button.active{background:var(--green);color:#fff}
.tabs{display:flex;gap:8px;padding:6px 16px 8px;overflow-x:auto;flex-shrink:0}
.tabs::-webkit-scrollbar{height:0}
.tab{padding:9px 19px;background:var(--surface);color:var(--muted);border-radius:22px;font-size:14px;font-weight:500;white-space:nowrap;transition:.18s var(--ease);box-shadow:var(--shadow);border:1px solid var(--line)}
.tab:hover{border-color:var(--gold-light);color:var(--text)}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.grid{flex:1;overflow-y:auto;padding:8px 16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-content:start}
.card{background:var(--surface);border-radius:var(--r-card);overflow:hidden;transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease);box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--gold-light);box-shadow:var(--shadow-lg)}
.card:active{transform:scale(.97)}
.card .thumb{height:92px;position:relative;background:linear-gradient(135deg,var(--surface-2),var(--line))}
.card .thumb .emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .info{padding:10px 12px}
.card .nm{font-size:14px;font-weight:500;line-height:1.25;min-height:35px}
.card .pr{color:var(--gold);font-weight:700;font-size:16px;margin-top:4px}
.card .pr small{color:var(--muted);font-weight:400;font-size:11px}
.card .lowbadge{position:absolute;top:8px;left:8px;background:var(--warn);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px}
.card.out{opacity:.5;pointer-events:none}
.card.out .thumb::after{content:'หมด';position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}

/* ---------- Cart ---------- */
.cart{width:360px;background:var(--surface);display:flex;flex-direction:column;box-shadow:-3px 0 16px rgba(27,58,47,.1);flex-shrink:0}
.cart-head{padding:12px 16px;background:var(--green-dark);color:#fff;display:flex;justify-content:space-between;align-items:center}
.cart-head h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.cart-head .cnt{background:var(--gold);color:#fff;border-radius:12px;font-size:12px;padding:1px 9px}
.order-meta{font-size:11px;color:var(--gold-light);text-align:right;line-height:1.4}
.table-btn{display:inline-flex;align-items:center;gap:5px;margin-top:6px;background:var(--gold-light);color:#2A2A24;border:none;padding:5px 13px;border-radius:15px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Prompt';box-shadow:0 1px 5px rgba(0,0,0,.25);transition:.15s var(--ease)}
.table-btn:hover{filter:brightness(1.06)}
.table-btn:active{transform:scale(.94)}
.table-btn.empty{background:var(--gold-light);color:#2A2A24}
.tbl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.tbl-pick{padding:20px 10px;border-radius:16px;background:var(--surface-2);border:2px solid var(--line);font-size:20px;font-weight:700;color:var(--text);cursor:pointer;font-family:'Prompt';transition:.15s var(--ease);box-shadow:var(--shadow)}
.tbl-pick:hover{border-color:var(--gold);background:var(--cream)}
.tbl-pick.sel{background:var(--gold);color:#fff;border-color:var(--gold)}
.tbl-pick:active{transform:scale(.94)}
.tbl-pick.skip{font-size:15px;color:var(--muted);font-weight:600}
.hold-bar{display:flex;gap:6px;padding:8px 12px;background:var(--surface-2);overflow-x:auto;flex-shrink:0;min-height:0}
.hold-bar:empty{display:none}
.hold-chip{background:var(--gold-light);color:#3a2c12;font-size:11px;padding:4px 10px;border-radius:14px;white-space:nowrap;font-weight:500}
.cart-items{flex:1;overflow-y:auto;padding:8px}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
.empty .ic{font-size:46px;opacity:.4;margin-bottom:10px}
.citem{display:flex;gap:10px;padding:11px;border-radius:10px;transition:.15s}
.citem:hover{background:var(--cream)}
.citem .cnm{flex:1}
.citem .cnm b{font-size:14px;font-weight:500}
.citem .mods{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.citem .cline{display:flex;align-items:center;gap:8px;margin-top:6px}
.qbtn{width:26px;height:26px;border-radius:8px;background:var(--cream);color:var(--text);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;line-height:1}
.qbtn:hover{background:var(--gold-light);color:#fff}
.citem .qv{min-width:22px;text-align:center;font-weight:600;font-size:14px}
.citem .cpr{font-weight:600;color:var(--gold);font-size:14px;min-width:64px;text-align:right}
.citem .rm{color:var(--danger);font-size:11px;background:none;margin-left:auto}
.summary{padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.sr{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
.sr.tot{font-size:20px;font-weight:700;color:var(--text);margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.sr.disc{color:var(--success)}
.cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 12px}
.btn{padding:13px;border-radius:var(--r-btn);font-size:14px;font-weight:600;transition:.15s var(--ease);display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn-pay{grid-column:1/3;background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;font-size:16px;padding:15px;box-shadow:0 4px 14px rgba(27,58,47,.28)}
.btn-pay:hover{filter:brightness(1.08);box-shadow:0 6px 20px rgba(27,58,47,.34)}
.btn-pay:disabled{opacity:.4;pointer-events:none}
.btn-ghost{background:var(--cream);color:var(--text)}
.btn-ghost:hover{background:var(--line)}
.btn-gold{background:var(--gold);color:#fff}
.btn-danger{background:var(--danger);color:#fff}

/* ---------- KDS ---------- */
.kds-wrap{flex:1;background:var(--green-dark);padding:16px;overflow-x:auto}
.kds-cols{display:flex;gap:16px;height:100%;align-items:flex-start}
.ticket{background:var(--surface);border-radius:var(--r-card);min-width:260px;max-width:280px;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden;border-top:5px solid var(--success)}
.ticket.warn{border-top-color:var(--warn)}
.ticket.late{border-top-color:var(--danger)}
.ticket-h{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--surface-2)}
.ticket-h b{font-size:16px}
.ticket-h .tmr{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.ticket-type{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--green);color:#fff}
.ticket-items{padding:6px 14px 10px}
.kitem{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.kitem:last-child{border:none}
.kitem.done{opacity:.4;text-decoration:line-through}
.kitem .kq{font-weight:700;color:var(--gold);min-width:24px}
.kitem .kmods{font-size:11px;color:var(--muted)}
.kitem .kchk{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;margin-left:auto;align-self:center}
.kitem.done .kchk{background:var(--success,#2f9e6e);border-color:var(--success,#2f9e6e)}
.kitem.done b{color:var(--muted)}
.ticket-foot{display:flex;gap:6px;padding:10px 14px;background:var(--surface-2)}
.ticket-foot button{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:600}

/* ---------- Generic panels / tables ---------- */
.panel{flex:1;overflow-y:auto;padding:20px 24px}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.panel-head h2{font-size:22px;font-weight:600;font-family:'Playfair Display',serif}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap}
.sub-tab{padding:9px 17px;border-radius:20px;background:var(--surface);color:var(--muted);font-size:13px;font-weight:500;box-shadow:var(--shadow);border:1px solid var(--line);transition:.15s var(--ease)}
.sub-tab:hover{border-color:var(--gold-light);color:var(--text)}
.sub-tab.active{background:var(--green);color:#fff;border-color:var(--green)}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow)}
th{background:var(--surface-2);text-align:left;padding:12px 14px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
td{padding:12px 14px;border-top:1px solid var(--line);font-size:14px}
tr:hover td{background:var(--surface-2)}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.pill.ok{background:rgba(62,124,79,.15);color:var(--success)}
.pill.lo{background:rgba(217,150,43,.18);color:var(--warn)}
.pill.no{background:rgba(179,58,58,.15);color:var(--danger)}
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--surface);border-radius:var(--r-card);padding:20px;box-shadow:var(--shadow);border:1px solid var(--line);transition:box-shadow .18s var(--ease),transform .18s var(--ease)}
.stat-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.stat-card .lbl{font-size:12px;color:var(--muted);font-weight:500}
.stat-card .val{font-size:26px;font-weight:700;margin-top:6px}
.stat-card .val small{font-size:14px;color:var(--muted);font-weight:400}
.stat-card .trend{font-size:12px;margin-top:4px}
.up{color:var(--success)} .down{color:var(--danger)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-row .bn{width:120px;font-size:13px}
.bar-track{flex:1;height:10px;background:var(--cream);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--gold);border-radius:6px;transition:width .4s var(--ease)}
.bar-row .bv{font-size:13px;font-weight:600;min-width:56px;text-align:right}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-btn);font-size:14px;background:var(--surface);color:var(--text);outline:none;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:var(--ring)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.add-fab{padding:10px 18px;border-radius:var(--r-btn);background:var(--green);color:#fff;font-size:14px;font-weight:600}

/* ---------- Overlays / Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,36,25,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:pop .25s var(--ease)}
.modal.wide{max-width:560px}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:18px;font-weight:600}
.modal-h .x{background:var(--cream);width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted)}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
.modal-f button{flex:1;padding:14px;border-radius:var(--r-btn);font-weight:600;font-size:15px}
.opt-group{margin-bottom:16px}
.opt-group h4{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--muted)}
.opt-chips{display:flex;flex-wrap:wrap;gap:8px}
.opt-chip{padding:9px 15px;border:1.5px solid var(--line);border-radius:20px;font-size:13px;font-weight:500;background:var(--surface);color:var(--text)}
.opt-chip.sel{border-color:var(--gold);background:var(--gold);color:#fff}
.qty-ctl{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0}
.qty-ctl button{width:44px;height:44px;border-radius:50%;background:var(--cream);font-size:24px;font-weight:600}
.qty-ctl .qn{font-size:26px;font-weight:700;min-width:40px;text-align:center}
.disc-opt{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r-btn);margin-bottom:10px;cursor:pointer}
.disc-opt:hover{border-color:var(--gold);background:var(--surface-2)}

/* ---------- PIN pad ---------- */
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto}
.pinpad button{padding:18px;border-radius:14px;background:var(--surface-2);font-size:22px;font-weight:600;color:var(--text)}
.pinpad button:hover{background:var(--gold-light);color:#fff}
.pinpad button.act{background:var(--green);color:#fff}
.pindots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.pindot{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);transition:.15s}
.pindot.fill{background:var(--gold)}

/* ---------- Lock screen ---------- */
#lockScreen{position:fixed;inset:0;background:var(--green-dark);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px}
#lockScreen.hide{display:none}
.lock-logo{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;letter-spacing:2px;color:#fff}
.lock-logo small{display:block;font-family:'Prompt';font-size:11px;letter-spacing:5px;color:var(--gold-light);text-align:center;margin-top:2px}
.lock-staff{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:24px 0 8px;max-width:420px}
.lock-staff button{background:rgba(255,255,255,.08);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;display:flex;align-items:center;gap:8px}
.lock-staff button.sel{background:var(--gold)}
.lock-staff .av{width:24px;height:24px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.lock-staff button.sel .av{background:rgba(0,0,0,.2)}
.lock-msg{color:var(--gold-light);font-size:13px;height:18px;margin-top:6px}

/* ---------- Receipt ---------- */
.receipt{font-family:'Courier New',monospace;background:#fff;color:#000;padding:18px;max-width:320px;margin:0 auto;font-size:12px;line-height:1.5}
.receipt .rc{text-align:center}
.receipt h3{font-family:'Playfair Display',serif;font-size:20px}
.receipt table{box-shadow:none;background:none}
.receipt td,.receipt th{border:none;padding:2px 0;font-size:12px;background:none!important;color:#000}
.receipt .rdiv{border-top:1px dashed #000;margin:8px 0}
.receipt .rtot{font-weight:700;font-size:14px}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--green-dark);color:#fff;padding:13px 22px;border-radius:24px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);z-index:200;transition:transform .3s var(--ease);display:flex;align-items:center;gap:8px}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger)}
#toast.ok{background:var(--success)}

/* QR */
.qr-box{background:#fff;padding:16px;border-radius:14px;display:inline-block;box-shadow:var(--shadow)}
.qr-customer{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--cream)}
/* ---- QR swipe carousel (หน้าลูกค้าสแกนสั่ง) ---- */
.qrc-head{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;padding:18px 16px 14px;text-align:center;flex-shrink:0;box-shadow:0 4px 18px rgba(15,36,25,.25)}
.qrc-head .qn{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;letter-spacing:1px}
.qrc-head small{color:var(--gold-light);font-size:11px;letter-spacing:2px}
.qrc-cats{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;flex-shrink:0}
.qrc-cats::-webkit-scrollbar{height:0}
.qrc-cat{padding:9px 18px;border-radius:22px;background:var(--surface);color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow);transition:.18s var(--ease)}
.qrc-cat.active{background:var(--gold);color:#fff;transform:scale(1.04)}
.qrc-stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center}
.qrc-track{display:flex;height:100%;width:100%;transition:transform .38s var(--ease);touch-action:pan-y}
.qrc-slide{min-width:min(84%,440px);height:100%;display:flex;align-items:center;justify-content:center;padding:14px 9px 8px;opacity:.4;transition:opacity .4s var(--ease)}
.qrc-slide.active{opacity:1}
.qrc-slide .qrc-card{transform:scale(.88);transition:transform .4s var(--ease)}
.qrc-slide.active .qrc-card{transform:scale(1)}
.qrc-card{background:var(--surface);border-radius:28px;box-shadow:var(--shadow-lg);width:100%;max-width:420px;height:96%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.qrc-hero{flex:1;background:linear-gradient(150deg,#f3ecdb,#e6d8ba);display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.qrc-hero .em{font-size:140px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.18))}
.qrc-hero img{width:100%;height:100%;object-fit:cover}
.qrc-hero .catbadge{position:absolute;top:18px;left:18px;background:rgba(15,36,25,.82);color:#fff;font-size:12px;font-weight:600;padding:6px 14px;border-radius:16px}
.qrc-hero .incart{position:absolute;top:18px;right:18px;background:var(--gold);color:#fff;font-size:14px;font-weight:700;min-width:30px;height:30px;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:0 8px}
.qrc-info{padding:18px 22px 20px;flex-shrink:0}
.qrc-info .nm{font-size:26px;font-weight:700;line-height:1.2}
.qrc-info .ds{font-size:13px;color:var(--muted);margin-top:4px;min-height:18px}
.qrc-info .row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.qrc-info .pr{font-size:30px;font-weight:800;color:var(--gold);font-family:'Playfair Display',serif}
.qrc-addbtn{background:var(--green);color:#fff;border-radius:18px;padding:14px 22px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(27,58,47,.28);transition:.15s var(--ease)}
.qrc-addbtn:active{transform:scale(.94)}
.qrc-arrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-lg);font-size:24px;color:var(--green);display:flex;align-items:center;justify-content:center;z-index:5;opacity:.92}
.qrc-arrow:active{transform:translateY(-50%) scale(.9)}
.qrc-arrow.l{left:10px} .qrc-arrow.r{right:10px}
.qrc-arrow.dis{opacity:.25;pointer-events:none}
.qrc-dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px 16px;flex-shrink:0;max-height:34px;overflow:hidden}
.qrc-dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:.2s}
.qrc-dot.on{background:var(--gold);width:22px;border-radius:5px}
.qrc-counter{text-align:center;font-size:12px;color:var(--muted);flex-shrink:0;padding-bottom:4px}
.qrc-bar{padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--surface);box-shadow:0 -3px 18px rgba(0,0,0,.1);flex-shrink:0}
.qrc-checkout{width:100%;background:var(--gold);color:#fff;border-radius:18px;padding:16px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.qrc-checkout:active{transform:scale(.98)}

/* responsive */
@media(max-width:860px){
  .cart{width:300px}
  nav .nav-btn span.lbl{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
@media(max-width:680px){
  .row2{grid-template-columns:1fr}
  .panel{padding:12px 10px}
  .panel-head h2{font-size:18px}
  .panel table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .cards-row{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat-card .val{font-size:18px}
  .ticket{min-width:82vw;max-width:82vw}
  #kdsCols{gap:10px;padding:10px}
  .overlay{padding:8px}
  .modal{max-width:100%!important;max-height:96vh;border-radius:14px}
  .modal-b{padding:14px 12px}
  .sub-tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;max-width:100%;padding-bottom:2px}
  .sub-tabs>*{flex-shrink:0}
  .otype{flex-shrink:0}
  .qr-box svg,.qr-box img{max-width:78vw;height:auto}
}
/* จอใหญ่พิเศษ (TV/จอกว้าง): จำกัดความกว้างการ์ดเมนูให้สวย */
@media(min-width:1600px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .panel{max-width:1500px;margin:0 auto}
}
/* ===== iPad / แท็บเล็ตแนวตั้ง (681–1024px): เมนูบน-ตะกร้าล่าง ปุ่มใหญ่นิ้วแตะ ===== */
/* ===== มือถือ + iPad (≤1024px): ☰ เมนูหลัก drawer · หมวดแถบซ้าย · ตะกร้าป๊อป ===== */
@media(max-width:1024px){
  .ham-btn{display:flex}
  .cart-fab{display:flex}
  header{padding:8px 12px;gap:10px}
  .brand{flex:1}
  .logo{font-size:21px;letter-spacing:.5px}
  .logo small{font-size:8px;letter-spacing:2px;margin-top:0}
  .clock{display:none}
  .hdr-right{gap:8px}
  #branchChip span:not(.av){display:none}
  /* เมนูหลัก = drawer ซ้าย เปิดด้วย ☰ */
  nav{position:fixed;top:0;left:0;height:100vh;width:232px;background:var(--green);flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:6px;padding:62px 12px 18px;z-index:60;transform:translateX(-100%);transition:transform .25s var(--ease);overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.25)}
  body.nav-open nav{transform:translateX(0)}
  nav .nav-btn{width:100%;justify-content:flex-start;font-size:15px;padding:13px 16px;border-radius:12px}
  nav .nav-btn span.lbl{display:inline}
  /* ตะกร้า = drawer ขวา เปิดด้วยปุ่มตะกร้า */
  .cart{position:fixed;top:0;right:0;height:100vh;width:min(380px,86vw)!important;z-index:60;transform:translateX(100%);transition:transform .25s var(--ease);box-shadow:-6px 0 26px rgba(0,0,0,.22)}
  body.cart-open .cart{transform:translateX(0)}
  body.nav-open .drawer-back,body.cart-open .drawer-back{display:block}
  /* หน้าขาย: หมวด=แถบซ้าย · เมนู=เต็มที่เหลือ */
  .view.active{flex-direction:row}
  .menu-area{flex:1;display:grid;grid-template-columns:94px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"top top" "cats grid";min-height:0}
  .pos-top{grid-area:top}
  .tabs{grid-area:cats;flex-direction:column;flex-wrap:nowrap;overflow-y:auto;gap:8px;padding:10px 8px;background:var(--surface-2);border-right:1px solid var(--line)}
  .tabs::-webkit-scrollbar{width:0}
  .tab{flex-shrink:0;width:100%;text-align:center;padding:12px 6px;font-size:12px;border-radius:13px;line-height:1.3}
  .grid{grid-area:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px 14px 24px;align-content:start}
  .card{min-height:0}
  .card .thumb{height:104px;background:var(--surface-2)}
  .card .thumb img{object-fit:contain;padding:7px}
  .card .thumb .emoji{font-size:42px}
  .card .info{padding:9px 10px 11px;text-align:center}
  .card .nm{font-size:13.5px;min-height:34px;line-height:1.25;display:flex;align-items:center;justify-content:center}
  .card .pr{font-size:16px;margin-top:2px}
  /* หน้าอื่น */
  .cards-row{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .panel table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .modal{max-width:92vw}
}
/* ===== เฉพาะมือถือเล็ก (≤680px): แถบหมวดแคบลง เมนู 2 คอลัมน์ ===== */
@media(max-width:680px){
  .menu-area{grid-template-columns:74px 1fr}
  .tabs{padding:8px 5px;gap:6px}
  .tab{padding:10px 4px;font-size:11px}
  .grid{grid-template-columns:repeat(2,1fr);gap:9px;padding:10px 11px 22px}
  .card .thumb{height:96px}
  .card .thumb .emoji{font-size:36px}
  .card .info{padding:8px 8px 10px}
  .card .nm{font-size:12px;min-height:30px;line-height:1.2}
  .card .pr{font-size:14px}
  .staff-chip{padding:4px 8px;font-size:12px}
  #staffChip span:not(.av){display:none}
  nav{width:80vw}
}
.hidden{display:none!important}

<body>
<div class="app">
  <!-- ===== HEADER ===== -->
  <header>
    <button class="ham-btn" id="hamBtn" onclick="UI.toggleNav()" aria-label="เมนูหลัก">☰<span class="ham-badge hidden" id="hamBadge"></span></button>
    <div class="brand">
      <div class="logo" id="brandLogo">SAO CAFE<small>ขาว คาเฟ่</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="hdr-right">
      <button class="staff-chip" id="branchChip" onclick="BRANCH.switcher()" title="สลับสาขา"><span class="av">🏢</span><span id="branchName">—</span></button>
      <span class="clock" id="clock">--:--:--</span>
      <button class="staff-chip" id="staffChip" onclick="AUTH.lock()">
        <span class="av" id="staffAv">?</span><span id="staffName">—</span>
      </button>
      <button class="cart-fab" id="cartFab" onclick="UI.toggleCart()" aria-label="ตะกร้า">🛒<span class="cfab-badge hidden" id="cartFabBadge">0</span></button>
    </div>
  </header>
  <div class="drawer-back" id="drawerBack" onclick="UI.closeDrawers()"></div>

  <!-- ===== POS VIEW ===== -->
  <section class="view active" id="v-pos">
    <div class="menu-area">
      <div class="pos-top">
        <div class="search">🔍<input id="search" placeholder="ค้นหาเมนู..." oninput="POS.search(this.value)"></div>
        <div class="otype" id="otype"></div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="cart">
      <div class="cart-head">
        <h3>🛒 ออเดอร์ <span class="cnt" id="cartCnt">0</span></h3>
        <div class="order-meta"><span id="orderNo">#000</span><br><span id="orderType">ทานที่ร้าน</span></div>
      </div>
      <div class="hold-bar" id="holdBar"></div>
      <div class="cart-items" id="cartItems"></div>
      <div class="summary" id="summary"></div>
      <div class="cart-actions">
        <button class="btn" id="tableChip" style="grid-column:1/3;display:none" onclick="POS.pickTable()"></button>
        <button class="btn btn-gold" style="grid-column:1/3" onclick="MEMBER.open()">👤 สมาชิก / สะสมแต้ม</button>
        <button class="btn btn-ghost" onclick="POS.hold()">⏸️ พักบิล</button>
        <button class="btn btn-ghost" onclick="DISC.open()">🏷️ ส่วนลด</button>
        <button class="btn btn-ghost" style="grid-column:1/3" onclick="SPLIT.open()">✂️ แยกบิล / จ่ายแยก</button>
        <button class="btn btn-pay" id="payBtn" onclick="PAY.open()" disabled>💵 ชำระเงิน</button>
      </div>
    </div>
  </section>

  <!-- ===== KDS VIEW ===== -->
  <section class="view" id="v-kds">
    <div class="kds-wrap"><div class="kds-cols" id="kdsCols"></div></div>
  </section>

  <section class="view" id="v-pending">
    <div class="panel" id="pendingPanel"></div>
  </section>

  <!-- ===== QR VIEW ===== -->
  <section class="view" id="v-qr">
    <div class="qr-customer" id="qrRoot"></div>
  </section>

  <!-- ===== REPORT VIEW ===== -->
  <section class="view" id="v-report">
    <div class="panel" id="reportPanel"></div>
  </section>

  <section class="view" id="v-history">
    <div class="panel" id="historyPanel"></div>
  </section>

  <!-- ===== BACK OFFICE VIEW ===== -->
  <section class="view" id="v-bo">
    <div class="panel">
      <div class="panel-head">
        <h2 id="boTitle">หลังร้าน</h2>
        <div class="sub-tabs" id="boTabs"></div>
      </div>
      <div id="boBody"></div>
    </div>
  </section>

  <!-- ===== SHIFT VIEW ===== -->
  <section class="view" id="v-shift">
    <div class="panel" id="shiftPanel"></div>
  </section>

  <!-- ===== SETTINGS VIEW ===== -->
  <section class="view" id="v-settings">
    <div class="panel" id="setPanel"></div>
  </section>
  <section class="view" id="v-ai">
    <div class="panel" id="aiPanel"></div>
  </section>
</div>

<div class="overlay" id="modOverlay"><div class="modal" id="modModal"></div></div>
<div class="overlay" id="discOverlay"><div class="modal" id="discModal"></div></div>
<div class="overlay" id="payOverlay"><div class="modal" id="payModal"></div></div>
<div class="overlay" id="genOverlay"><div class="modal" id="genModal"></div></div>

  <div class="lock-logo" id="lockLogo">SAO CAFE<small>ขาว คาเฟ่</small></div>

</div>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

    (D.products||[]).filter(x=>(x.branchId||'BR-001')===fromB&&!x.deletedAt).forEach(o=>{ const n=JSON.parse(JSON.stringify(o)); n.id=uuid(); n.branchId=toB; n.cost=0; if(catMap[o.cat])n.cat=catMap[o.cat]; if(Array.isArray(n.recipe))n.recipe=n.recipe.map(r=>({ingredientId:ingMap[r.ingredientId]||r.ingredientId,qty:r.qty})); D.products.push(n); });
    (D.tables||[]).filter(x=>(x.branchId||'BR-001')===fromB&&!x.deletedAt).forEach(o=>{ D.tables.push(Object.assign({},o,{id:uuid(),branchId:toB})); });
    (D.promos||[]).filter(x=>(x.branchId||'BR-001')===fromB&&!x.deletedAt).forEach(o=>{ D.promos.push(Object.assign({},o,{id:uuid(),branchId:toB})); });
    save();
  }
  function scoped(key){ const b=bid(); return (DB[key]||[]).filter(x=> (x.branchId||'BR-001')===b ); }
  function bcounter(){ if(!DB.branchCounters) DB.branchCounters={}; const b=bid(); if(!DB.branchCounters[b]) DB.branchCounters[b]={orderNo:1,receiptNo:1}; return DB.branchCounters[b]; }
  function binfo(){ const b=curBranch()||{}; const m=Object.assign({},DB.meta||{}); m.branchName=b.name||m.branchName||''; m.promptpayId=b.promptpayId||''; m.taxId=b.taxId||''; m.address=b.address||''; return m; }
  function ensureHQ(data){
    try{
      const alive=(data.staff||[]).filter(x=>!x.deletedAt&&x.active!==false);
      if(alive.length && !alive.some(x=>x.hq===true)){ alive.forEach(x=>{ if(x.role==='owner') x.hq=true; }); }
    }catch(e){}
    return data;
  }
  function load(){
    try{
      const raw=localStorage.getItem(KEY);
      if(!raw){ DB=seed(); stampBranches(DB); save(); return DB; }
      let data=JSON.parse(raw);
      if(!data.meta || data.meta.version!==VERSION){ data=migrate(data); ensureHQ(data); DB=data; save(); return DB; }
      ensureHQ(data); DB=data; return DB;
    }catch(e){
      console.error('load fail',e);
      DB=seed(); stampBranches(DB); save(); return DB; // fallback ไม่ให้ระบบล่ม
    }
  }
  function save(){
    try{ localStorage.setItem(KEY,JSON.stringify(DB)); }
    catch(e){ console.error('save fail',e); UI.toast('บันทึกข้อมูลไม่สำเร็จ (พื้นที่เต็ม?)','err'); }
  }
  function reset(){ if(confirm('ล้างข้อมูลทั้งหมดและเริ่มใหม่?')){ DB=seed(); stampBranches(DB); save(); location.reload(); } }
  function get(){ return DB; }
  function find(arr,id){ return (DB[arr]||[]).find(x=>x.id===id); }

  function hardReset(){ DB=seed(); stampBranches(DB); save(); try{localStorage.removeItem('saocafe_cart');}catch(e){} location.reload(); }
  function bid(){ return (DB&&DB.meta&&DB.meta.currentBranchId)||'BR-001'; }
  function setBid(id){ if(DB&&DB.meta){ DB.meta.currentBranchId=id; save(); } }
  function curBranch(){ return (DB.branches||[]).find(b=>b.id===bid())||null; }
  return {load,save,reset,hardReset,get,find,uuid,now,baht,toSatang,seed,bid,setBid,curBranch,scoped,stampBranches,cloneBranch,bcounter,binfo};
})();

/* ============================================================
   2. AUTH — PIN lock, RBAC, staff switch, approval gate
   ============================================================ */
const AUTH = (()=>{
  let current=null, pinBuf='', selStaff=null, approveCb=null;
  // เมทริกซ์สิทธิ์ตามตำแหน่ง
  const PERMS={
    owner:['*'],
    manager:['pos','kds','report','bo_menu','bo_stock','bo_member','bo_promo','shift','void','discount','refund','cashcount'],
    cashier:['pos','kds','member_view','shift','cashcount'],
    barista:['kds']
  };
  function can(perm){
    if(!current) return false;
    if(current.role==='owner') return true;
    const rp=(STORE.get().settings.rolePerms||{})[current.role];
    const p = Array.isArray(rp)? rp : (PERMS[current.role]||[]);
    return p.includes('*')||p.includes(perm);
  }
  function defaultPerms(role){ return PERMS[role]||[]; }
  function isHQ(){ return !!current && current.hq===true; }
  function get(){ return current; }
  function login(staff,pin){
    if(staff.pin!==pin) return false;
    current=staff;
    if(!isHQ() && staff.branchId) STORE.setBid(staff.branchId);   // พนักงาน/แฟรนไชส์ -> เข้าสาขาตัวเองอัตโนมัติ
    // จับเวลาเข้างาน
    staff.hoursLog=staff.hoursLog||[]; staff.hoursLog.push({in:STORE.now(),out:null});
    STORE.save(); saveSession(); renderChip(); NAV.build(); NAV.go(can('pos')?'pos':'kds'); return true;
  }
  // ---- จำการล็อกอิน (กันรีเฟรชแล้วหลุด) ----
  function saveSession(){ try{ if(current) localStorage.setItem('saocafe_session',JSON.stringify({id:current.id,at:STORE.now()})); }catch(e){} }
  function clearSession(){ try{ localStorage.removeItem('saocafe_session'); }catch(e){} }
  function tryRestore(){
    try{
      const r=localStorage.getItem('saocafe_session'); if(!r) return false;
      const ses=JSON.parse(r); if(!ses||!ses.id) return false;
      const tmin=STORE.get().settings.sessionTimeoutMin||0;
      const maxAge=tmin>0?tmin*60000:7*24*3600000;   // 0=ไม่ล็อก (คงสภาพ 7 วัน)
      if(STORE.now()-ses.at > maxAge) return false;
      const staff=STORE.find('staff',ses.id); if(!staff||!staff.active) return false;
      current=staff; if(!isHQ() && staff.branchId) STORE.setBid(staff.branchId);
      saveSession();                             // ต่ออายุ session
      renderChip(); NAV.build(); NAV.go(can('pos')?'pos':'kds');
      $('#lockScreen').classList.add('hide'); return true;
    }catch(e){ return false; }
  }
  function lock(){
    const c=current;
    if(c){ const h=(c.hoursLog||[]).slice(-1)[0]; if(h&&!h.out){ h.out=STORE.now(); STORE.save(); } }
    current=null; pinBuf=''; selStaff=null; clearSession(); renderLock(); $('#lockScreen').classList.remove('hide');
  }
  function renderChip(){
    if(!current) return;
    $('#staffAv').textContent=current.name.charAt(0);
    $('#staffName').textContent=current.name;
    BRANCH.renderChip();
  }
  function renderLock(){
    const el=$('#lockStaff'); if(el){ el.innerHTML=''; el.style.display='none'; }   // ใส่ PIN อย่างเดียว ไม่โชว์รายชื่อ
    selStaff=null;
    renderDots(); buildPad('#lockPad','lock');
  }
  function roleTh(r){ return {owner:'เจ้าของ',manager:'ผจก.',cashier:'แคชเชียร์',barista:'บาริสต้า'}[r]||r; }
  function pick(id){ selStaff=id; pinBuf=''; renderLock(); $('#lockMsg').textContent='ใส่ PIN 4 หลัก'; }
  function renderDots(){
    $('#lockDots').innerHTML=[0,1,2,3].map(i=>`<div class="pindot ${i<pinBuf.length?'fill':''}"></div>`).join('');
  }
  function buildPad(sel,mode){
    const keys=['1','2','3','4','5','6','7','8','9','C','0','⌫'];
    $(sel).innerHTML=keys.map(k=>`<button onclick="AUTH.key('${k}','${mode}')">${k}</button>`).join('');
  }
  function key(k,mode){
    const setBuf=(v)=>{ if(mode==='lock'){ pinBuf=v; renderDots(); } else { approveBuf=v; renderApproveDots(); } };
    let buf=mode==='lock'?pinBuf:approveBuf;
    if(k==='C') buf='';
    else if(k==='⌫') buf=buf.slice(0,-1);
    else if(buf.length<4) buf+=k;
    setBuf(buf);
    if(buf.length===4){ mode==='lock'?tryLogin(buf):tryApprove(buf); }
  }
  function tryLogin(pin){
    // ถ้าเลือกพนักงานไว้ใช้คนนั้น ไม่งั้นค้นหาพนักงานจาก PIN เลย
    let staff = selStaff ? STORE.find('staff',selStaff) : STORE.get().staff.find(x=>x.active&&!x.deletedAt&&x.pin===pin&&(x.hq||(x.branchId||'BR-001')===STORE.bid()));
    if(staff && login(staff,pin)){ $('#lockScreen').classList.add('hide'); UI.toast('ยินดีต้อนรับ '+staff.name,'ok'); }
    else { $('#lockMsg').textContent='PIN ไม่ถูกต้อง ลองใหม่'; pinBuf=''; selStaff=null; renderLock(); $('#lockMsg').textContent='PIN ไม่ถูกต้อง ลองใหม่'; }
  }
  // ---- Approval gate (อนุมัติด้วย PIN ผจก./เจ้าของ) ----
  let approveBuf='';
  function requireApproval(reason,cb){
    if(can('void')||current.role==='owner'){ cb(); return; } // มีสิทธิ์อยู่แล้ว
    approveCb=cb; approveBuf='';
    $('#pinModal').innerHTML=`
      <div class="modal-h"><h3>🔐 ขออนุมัติผู้จัดการ</h3><button class="x" onclick="UI.close('pinOverlay')">×</button></div>
      <div class="modal-b" style="text-align:center">
        <p style="color:var(--muted);font-size:13px;margin-bottom:8px">${esc(reason)}</p>
        <div class="pindots" id="approveDots"></div>
        <div class="pinpad" id="approvePad"></div>
      </div>`;
    renderApproveDots(); buildPad('#approvePad','approve'); UI.open('pinOverlay');
  }
  function renderApproveDots(){ const el=$('#approveDots'); if(el) el.innerHTML=[0,1,2,3].map(i=>`<div class="pindot ${i<approveBuf.length?'fill':''}"></div>`).join(''); }
  function tryApprove(pin){
    const mgr=STORE.get().staff.find(s=>(s.role==='manager'||s.role==='owner')&&s.pin===pin&&s.active);
    if(mgr){ UI.close('pinOverlay'); UI.toast('อนุมัติโดย '+mgr.name,'ok'); if(approveCb) approveCb(); approveCb=null; }
    else { approveBuf=''; renderApproveDots(); UI.toast('PIN ผู้จัดการไม่ถูกต้อง','err'); }
  }
  return {can,get,login,lock,pick,key,renderLock,renderChip,requireApproval,roleTh,tryRestore,defaultPerms,PERMS,isHQ};
})();

/* ============================================================
   UI — toast, overlay open/close, generic confirm/modal
   ============================================================ */
const UI = (()=>{
  let toastT=null;
  function toast(msg,type){
    const t=$('#toast'); t.textContent=msg; t.className='show'+(type?' '+type:'');
    clearTimeout(toastT); toastT=setTimeout(()=>t.className='',2200);
  }
  function open(id){ try{ closeDrawers(); }catch(e){} $('#'+id).classList.add('show'); }
  function close(id){ $('#'+id).classList.remove('show'); }
  function confirm2(title,msg,onYes,danger){
    $('#genModal').innerHTML=`
      <div class="modal-h"><h3>${esc(title)}</h3><button class="x" onclick="UI.close('genOverlay')">×</button></div>
      <div class="modal-b"><p style="font-size:14px;line-height:1.6">${esc(msg)}</p></div>
      <div class="modal-f">
        <button class="btn-ghost" onclick="UI.close('genOverlay')">ยกเลิก</button>
        <button class="${danger?'btn-danger':'btn-gold'}" id="genYes">ยืนยัน</button>
      </div>`;
    open('genOverlay');
    $('#genYes').onclick=()=>{ close('genOverlay'); onYes(); };
  }
  // กล่อง prompt แบบ custom (เลี่ยง prompt() ที่ดูไม่โปร)
  function ask(title,fields,onOk){
    $('#genModal').innerHTML=`
      <div class="modal-h"><h3>${esc(title)}</h3><button class="x" onclick="UI.close('genOverlay')">×</button></div>
      <div class="modal-b">${fields.map(f=>`
        <div class="field"><label>${esc(f.label)}</label>
        ${f.type==='select'?`<select id="ask_${f.key}">${f.options.map(o=>`<option value="${esc(o.v)}" ${o.v==f.value?'selected':''}>${esc(o.t)}</option>`).join('')}</select>`
        :`<input id="ask_${f.key}" type="${f.type||'text'}" value="${esc(f.value==null?'':f.value)}" placeholder="${esc(f.ph||'')}">`}</div>`).join('')}</div>
      <div class="modal-f">
        <button class="btn-ghost" onclick="UI.close('genOverlay')">ยกเลิก</button>
        <button class="btn-gold" id="askOk">บันทึก</button>
      </div>`;
    open('genOverlay');
    $('#askOk').onclick=()=>{
      const out={}; fields.forEach(f=>out[f.key]=$('#ask_'+f.key).value);
      close('genOverlay'); onOk(out);
    };
  }
  function toggleNav(){ document.body.classList.toggle('nav-open'); document.body.classList.remove('cart-open'); }
  function toggleCart(){ document.body.classList.toggle('cart-open'); document.body.classList.remove('nav-open'); }
  function closeDrawers(){ document.body.classList.remove('nav-open','cart-open'); }
  function updateHamBadge(){
    const b=$('#hamBadge'); if(!b) return; let n=0;
    try{ n+=KDS.active().length; }catch(e){}
    try{ n+=PENDING.waitList().length+PENDING.openTabs().length; }catch(e){}
    b.textContent=n; b.classList.toggle('hidden',n===0);
  }
  return {toast,open,close,confirm2,ask,toggleNav,toggleCart,closeDrawers,updateHamBadge};
})();

/* ============================================================
   NAV — role-aware top navigation + view router
   ============================================================ */
const NAV = (()=>{
  const ALL=[
    {k:'pos',label:'ขาย',icon:'🛒',perm:'pos'},
    {k:'kds',label:'จอครัว',icon:'👨‍🍳',perm:'kds'},
    {k:'pending',label:'รอชำระ',icon:'📥',perm:'pos'},
    {k:'qr',label:'QR ลูกค้า',icon:'📱',perm:'pos'},
    {k:'report',label:'รายงาน',icon:'📊',perm:'report'},
    {k:'ai',label:'ผู้ช่วย AI',icon:'🤖',perm:'report'},
    {k:'history',label:'ประวัติบิล',icon:'📜',perm:'report'},
    {k:'bo',label:'หลังร้าน',icon:'⚙️',perm:'bo_menu'},
    {k:'shift',label:'กะ/เงินสด',icon:'💰',perm:'shift'},
    {k:'settings',label:'ตั้งค่า',icon:'🔧',perm:'*'}
  ];
  let cur='pos';
  function build(){
    const items=ALL.filter(i=> i.perm==='*'? AUTH.get().role==='owner' : AUTH.can(i.perm));
    $('#nav').innerHTML=items.map(i=>`<button class="nav-btn ${i.k===cur?'active':''}" data-k="${i.k}" onclick="NAV.go('${i.k}')">${i.icon}<span class="lbl">${i.label}</span>${i.k==='kds'?`<span class="bdg hidden" id="kdsBdg"></span>`:i.k==='pending'?`<span class="bdg hidden" id="pendingBdg"></span>`:''}</button>`).join('');
    KDS.updateBadge(); PENDING.updateBadge();
  }
  function go(k){
    cur=k;
    try{ UI.closeDrawers(); }catch(e){}
    $$('.view').forEach(v=>v.classList.remove('active'));
    $('#v-'+k).classList.add('active');
    $$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.k===k));
    if(k==='pos') POS.render();
    if(k==='kds') KDS.render();
    if(k==='qr') QR.render();
    if(k==='report') REPORT.render();
    if(k==='ai') AI.render();
    if(k==='history') HISTORY.render();
    if(k==='pending') PENDING.render();
    if(k==='bo') BO.render();
    if(k==='shift') SHIFT.render();
    if(k==='settings') SETTINGS.render();
  }
  return {build,go,cur:()=>cur};
})();

/* ============================================================
   3-4. POS — menu, cart, modifiers, hold/resume, split, void
   ============================================================ */
const POS = (()=>{
  let cat='featured', cart=[], orderType='dine-in', discount=null, member=null, q='', orderNo=null, table=null;
  const types=[{k:'dine-in',t:'ทานที่ร้าน'},{k:'takeaway',t:'กลับบ้าน'},{k:'delivery',t:'เดลิเวอรี่'}];

  function render(){
    restoreCart();
    renderTypes(); renderTabs(); renderGrid(); renderCart();
    if(!orderNo) newOrderNo();
  }
  // เซฟตะกร้าที่กำลังทำลง localStorage (กันรีเฟรช/ปิดพลาด แล้วของหาย)
  function persistCart(){ try{ localStorage.setItem('saocafe_cart',JSON.stringify({cart,orderType,discount,member,table,orderNo})); }catch(e){} }
  function restoreCart(){ if(cart.length) return; try{ const r=localStorage.getItem('saocafe_cart'); if(r){ const d=JSON.parse(r); if(d&&d.cart&&d.cart.length){ cart=d.cart; orderType=d.orderType||'dine-in'; discount=d.discount||null; member=d.member||null; table=d.table||null; orderNo=d.orderNo||null; } } }catch(e){} }
  function hasCart(){ return cart.length>0; }
  function newOrderNo(){ orderNo='#'+String(STORE.bcounter().orderNo).padStart(3,'0'); $('#orderNo').textContent=orderNo; }
  function renderTypes(){
    $('#otype').innerHTML=types.map(t=>`<button class="${t.k===orderType?'active':''}" onclick="POS.setType('${t.k}')">${t.t}</button>`).join('');
    $('#orderType').textContent=(types.find(t=>t.k===orderType)||{}).t;
    const chip=$('#tableChip');
    if(chip){ if(orderType==='dine-in'){ chip.style.display='flex'; chip.innerHTML='🪑 '+(table?('โต๊ะ '+esc(table)):'เลือกโต๊ะ'); chip.className='btn '+(table?'btn-gold':'btn-ghost'); } else { chip.style.display='none'; table=null; } }
  }
  function pickTable(){
    if(orderType!=='dine-in') return;
    const tables=STORE.scoped('tables').filter(t=>t.active&&!t.deletedAt);
    if(!tables.length){ UI.toast('ยังไม่มีโต๊ะ (เพิ่มที่หลังร้าน › โต๊ะ)','err'); return; }
    $('#genModal').className='modal wide';
    $('#genModal').innerHTML=`<div class="modal-h"><h3>🪑 เลือกโต๊ะ</h3><button class="x" onclick="UI.close('genOverlay')">×</button></div>
      <div class="modal-b"><div class="tbl-grid">
      ${tables.map(t=>`<button class="tbl-pick ${table===t.name?'sel':''}" onclick="POS.setTable('${t.name}')">${esc(t.name)}</button>`).join('')}
      <button class="tbl-pick skip" onclick="POS.setTable('')">ไม่ระบุ</button></div></div>`;
    UI.open('genOverlay');
  }
  function setTable(t){ table=t||null; renderTypes(); UI.close('genOverlay'); }
  function getTable(){ return table; }
  function setType(k){ orderType=k; renderTypes(); repriceCart(); renderGrid(); }
  // ราคาตามประเภทออเดอร์: ใช้ราคาที่ตั้งเฉพาะ ถ้าไม่ตั้งให้ใช้ราคาหลัก (ทานที่ร้าน)
  function priceOf(p,type){ type=type||orderType; const pr=p.prices&&p.prices[type]; return (pr!=null&&pr!=='')?pr:p.price; }
  function repriceCart(){ cart.forEach(c=>{ const p=STORE.find('products',c.productId); if(p) c.base=priceOf(p); }); renderCart(); }
  function renderTabs(){
    const cats=STORE.scoped('categories').filter(c=>!c.deletedAt).slice().sort((a,b)=>a.sort-b.sort);
    $('#tabs').innerHTML=`<button class="tab ${cat==='featured'?'active':''}" onclick="POS.setCat('featured')">⭐ ขายดี</button>`+
      `<button class="tab ${cat==='all'?'active':''}" onclick="POS.setCat('all')">ทั้งหมด</button>`+
      cats.map(c=>`<button class="tab ${cat===c.id?'active':''}" onclick="POS.setCat('${c.id}')">${esc(c.name)}</button>`).join('');
  }
  function setCat(c){ cat=c; renderTabs(); renderGrid(); }
  function search(v){ q=v.trim().toLowerCase(); renderGrid(); }
  function renderGrid(){
    let items=STORE.scoped('products').filter(p=>p.available!==false&&!p.deletedAt);
    if(cat==='featured'){
      // ขายดี = เมนูที่ปักหมุดเอง (มาก่อน) + เมนูที่ขายดีจากยอดขายจริง
      const tally={}; STORE.get().orders.filter(o=>o.status!=='void'&&o.method!=='unpaid'&&(o.branchId||'BR-001')===STORE.bid()).forEach(o=>(o.items||[]).forEach(it=>{ tally[it.productId]=(tally[it.productId]||0)+it.qty; }));
      const pinned=items.filter(p=>p.featured&&!p.hideFeatured);
      const sellers=items.filter(p=>!p.featured&&!p.hideFeatured&&tally[p.id]).sort((a,b)=>(tally[b.id]||0)-(tally[a.id]||0));
      items=[...pinned,...sellers];
      if(!items.length) items=STORE.scoped('products').filter(p=>p.available!==false&&!p.deletedAt&&!p.hideFeatured);  // ยังไม่มีขายดี -> โชว์ทั้งหมด (เว้นเมนูที่ซ่อน)
    } else if(cat!=='all') items=items.filter(p=>p.cat===cat);
    if(q) items=items.filter(p=>p.name.toLowerCase().includes(q));
    if(!items.length){ $('#grid').innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="ic">⭐</div>${cat==='featured'?'ยังไม่มีเมนูขายดี<br><small>ปักหมุดเมนูที่ หลังร้าน › เมนู หรือรอข้อมูลการขาย</small>':'ไม่พบเมนู'}</div>`; return; }
    $('#grid').innerHTML=items.map(p=>{
      const low=INV.isLow(p);
      return `<div class="card ${INV.outOfStock(p)?'out':''}" onclick="POS.tap('${p.id}')">
        <div class="thumb">${p.img?`<img src="${esc(p.img)}">`:`<div class="emoji">${esc(p.emoji||'☕')}</div>`}${low?'<span class="lowbadge">ใกล้หมด</span>':''}</div>
        <div class="info"><div class="nm">${esc(p.name)}</div><div class="pr">${STORE.baht(priceOf(p))}</div></div>
      </div>`;
    }).join('');
  }
  function tap(id){
    const p=STORE.find('products',id);
    if(!p) return;
    if(p.options&&p.options.length) MOD.open(p);
    else addToCart(p,1,[],0);
  }
  function addToCart(p,qty,mods,modPrice){
    // รวมรายการเหมือนกัน (ชื่อ+mods เดียวกัน) เป็นชิ้นเดียว
    const sig=p.id+'|'+mods.map(m=>m.group+':'+m.name).join(',');
    const ex=cart.find(c=>c.sig===sig);
    if(ex) ex.qty+=qty;
    else cart.push({line:STORE.uuid(),sig,productId:p.id,name:p.name,base:priceOf(p),modPrice,mods,qty,note:''});
    renderCart(); UI.toast(p.name+' x'+qty,'ok');
  }
  function chQty(line,d){
    const c=cart.find(x=>x.line===line); if(!c) return;
    c.qty+=d; if(c.qty<=0) cart=cart.filter(x=>x.line!==line); renderCart();
  }
  function rmItem(line){ cart=cart.filter(x=>x.line!==line); renderCart(); }
  function lineTotal(c){ return (c.base+c.modPrice)*c.qty; }
  function calc(){
    const sub=cart.reduce((s,c)=>s+lineTotal(c),0);
    let disc=0;
    if(discount){
      if(discount.type==='percent'||discount.type==='happyhour') disc=Math.round(sub*discount.value/100);
      else if(discount.type==='amount') disc=discount.value;
      else if(discount.type==='points') disc=discount.value;
      disc=Math.min(disc,sub);
    }
    const afterDisc=sub-disc;
    const m=STORE.get().meta;
    let vat=0, service=0, total=afterDisc;
    if(m.serviceCharge>0){ service=Math.round(afterDisc*m.serviceCharge/100); }
    const baseForVat=afterDisc+service;
    if(m.vatRate>0){
      if(m.vatIncluded) vat=Math.round(baseForVat - baseForVat*100/(100+m.vatRate)); // VAT in
      else { vat=Math.round(baseForVat*m.vatRate/100); }
    }
    total = m.vatIncluded ? baseForVat : baseForVat+vat;
    return {sub,disc,vat,service,total};
  }
  function renderCart(){
    persistCart();
    const _cn=cart.reduce((s,c)=>s+c.qty,0);
    $('#cartCnt').textContent=_cn;
    const _fb=$('#cartFabBadge'); if(_fb){ _fb.textContent=_cn; _fb.classList.toggle('hidden',_cn===0); }
    renderHolds();
    if(!cart.length){
      $('#cartItems').innerHTML=`<div class="empty"><div class="ic">🛒</div>ยังไม่มีรายการ<br><small>แตะเมนูเพื่อเพิ่ม</small></div>`;
      $('#summary').innerHTML=''; $('#payBtn').disabled=true; return;
    }
    $('#payBtn').disabled=false;
    $('#cartItems').innerHTML=cart.map(c=>{
      const modTxt=c.mods.filter(m=>m.name!=='ปกติ').map(m=>m.name).join(', ');
      return `<div class="citem">
        <div class="cnm"><b>${esc(c.name)}</b>${modTxt?`<div class="mods">${esc(modTxt)}</div>`:''}
          <div class="cline">
            <button class="qbtn" onclick="POS.chQty('${c.line}',-1)">−</button>
            <span class="qv">${c.qty}</span>
            <button class="qbtn" onclick="POS.chQty('${c.line}',1)">+</button>
            <span class="cpr">${STORE.baht(lineTotal(c))}</span>
            <button class="rm" onclick="POS.rmItem('${c.line}')">ลบ</button>
          </div>
        </div></div>`;
    }).join('');
    const s=calc(), m=STORE.get().meta;
    let html=`<div class="sr"><span>ยอดรวม</span><span>${STORE.baht(s.sub)}</span></div>`;
    if(s.disc>0) html+=`<div class="sr disc"><span>ส่วนลด${discount&&discount.label?' ('+esc(discount.label)+')':''}</span><span>-${STORE.baht(s.disc)}</span></div>`;
    if(member) html+=`<div class="sr" style="color:var(--gold)"><span>👤 ${esc(member.name)}</span><span>${member.points} แต้ม</span></div>`;
    if(s.service>0) html+=`<div class="sr"><span>Service ${m.serviceCharge}%</span><span>${STORE.baht(s.service)}</span></div>`;
    if(s.vat>0) html+=`<div class="sr"><span>VAT ${m.vatRate}%${m.vatIncluded?' (รวมแล้ว)':''}</span><span>${STORE.baht(s.vat)}</span></div>`;
    html+=`<div class="sr tot"><span>สุทธิ</span><span>${STORE.baht(s.total)}</span></div>`;
    $('#summary').innerHTML=html;
  }
  // ---- พักบิล / เรียกคืน ----
  function hold(){
    if(!cart.length){ UI.toast('ไม่มีรายการให้พัก','err'); return; }
    STORE.get().holds.push({id:STORE.uuid(),no:orderNo,cart:JSON.parse(JSON.stringify(cart)),orderType,discount,member,at:STORE.now(),branchId:STORE.bid()});
    STORE.save(); cart=[]; discount=null; member=null; orderNo=null; newOrderNo(); renderCart();
    UI.toast('พักบิลแล้ว','ok');
  }
  function renderHolds(){
    const holds=STORE.get().holds.filter(h=>(h.branchId||'BR-001')===STORE.bid());
    $('#holdBar').innerHTML=holds.map(h=>`<button class="hold-chip" onclick="POS.resume('${h.id}')">⏸ ${esc(h.no)} (${h.cart.reduce((s,c)=>s+c.qty,0)})</button>`).join('');
  }
  function resume(id){
    const holds=STORE.get().holds; const h=holds.find(x=>x.id===id); if(!h) return;
    if(cart.length){ UI.confirm2('มีบิลค้างอยู่','บิลปัจจุบันจะถูกพักไว้ก่อน ต้องการเรียกบิลนี้?',()=>{ hold(); doResume(h); }); }
    else doResume(h);
  }
  function doResume(h){
    cart=h.cart; orderType=h.orderType; discount=h.discount; member=h.member; orderNo=h.no;
    STORE.get().holds=STORE.get().holds.filter(x=>x.id!==h.id); STORE.save();
    $('#orderNo').textContent=orderNo; renderTypes(); renderCart(); UI.toast('เรียกบิล '+h.no,'ok');
  }
  // ---- แยกบิล (split) ----
  function getState(){ return {cart,orderType,discount,member,orderNo,calc}; }
  function clearAfterPay(){ cart=[]; discount=null; member=null; table=null; orderNo=null; STORE.bcounter().orderNo++; STORE.save(); newOrderNo(); renderTypes(); renderCart(); }
  function setDiscount(d){ discount=d; renderCart(); }
  function setMember(m){ member=m; renderCart(); }
  function getCart(){ return cart; }
  function getMember(){ return member; }
  function getDiscount(){ return discount; }
  function getType(){ return orderType; }
  return {render,setType,setCat,search,tap,addToCart,chQty,rmItem,hold,resume,calc,clearAfterPay,priceOf,pickTable,setTable,getTable,
          setDiscount,setMember,getCart,getMember,getDiscount,getType,getState,newOrderNo,renderCart,restoreCart,hasCart};
})();

/* ============================================================
   MOD — modifier selector overlay
   ============================================================ */
const MOD = (()=>{
  let prod=null, sel={}, qty=1;
  function open(p){
    prod=p; qty=1; sel={};
    const mods=p.options.map(id=>STORE.find('modifiers',id)).filter(Boolean);
    mods.forEach(m=>{ if(m.type==='single'&&m.required) sel[m.id]=[m.options[0].name]; else sel[m.id]=[]; });
    $('#modModal').innerHTML=`
      <div class="modal-h"><h3>${esc(p.name)}</h3><button class="x" onclick="UI.close('modOverlay')">×</button></div>
      <div class="modal-b" id="modBody"></div>
      <div class="modal-f"><button class="btn-gold" id="modAdd" onclick="MOD.confirm()"></button></div>`;
    renderBody(); UI.open('modOverlay');
  }
  function renderBody(){
    const mods=prod.options.map(id=>STORE.find('modifiers',id)).filter(Boolean);
    $('#modBody').innerHTML=mods.map(m=>`
      <div class="opt-group"><h4>${esc(m.name)}${m.required?' *':''}</h4>
      <div class="opt-chips">${m.options.map(o=>{
        const on=(sel[m.id]||[]).includes(o.name);
        return `<button class="opt-chip ${on?'sel':''}" onclick="MOD.pick('${m.id}','${esc(o.name)}','${m.type}')">${esc(o.name)}${o.price>0?` +${STORE.baht(o.price)}`:''}</button>`;
      }).join('')}</div></div>`).join('')+
      `<div class="qty-ctl"><button onclick="MOD.q(-1)">−</button><span class="qn">${qty}</span><button onclick="MOD.q(1)">+</button></div>`;
    updateBtn();
  }
  function pick(mid,name,type){
    sel[mid]=sel[mid]||[];
    if(type==='single') sel[mid]=[name];
    else { sel[mid]=sel[mid].includes(name)?sel[mid].filter(n=>n!==name):[...sel[mid],name]; }
    renderBody();
  }
  function q(d){ qty=Math.max(1,qty+d); renderBody(); }
  function calcMods(){
    const mods=prod.options.map(id=>STORE.find('modifiers',id)).filter(Boolean);
    let price=0; const chosen=[];
    mods.forEach(m=>{ (sel[m.id]||[]).forEach(n=>{ const o=m.options.find(x=>x.name===n); if(o){ price+=o.price; chosen.push({group:m.name,name:n,price:o.price}); } }); });
    return {price,chosen};
  }
  function updateBtn(){ const c=calcMods(); $('#modAdd').textContent=`เพิ่ม ${qty} รายการ • ${STORE.baht((POS.priceOf(prod)+c.price)*qty)}`; }
  function confirm(){
    const c=calcMods();
    POS.addToCart(prod,qty,c.chosen,c.price);
    UI.close('modOverlay');
  }
  return {open,pick,q,confirm};
})();

const PROMO = (()=>{
  function quick(type,value,label){ POS.setDiscount({type,value,label}); UI.close('discOverlay'); UI.toast('ใช้ส่วนลด: '+label,'ok'); }
  function clear(){ POS.setDiscount(null); UI.close('discOverlay'); UI.toast('ล้างส่วนลดแล้ว','ok'); }
  function applyCode(code){
    if(!code) return;
    const p=STORE.scoped('promos').find(x=>x.code===code&&x.active&&!x.deletedAt);
    if(!p){ UI.toast('โค้ดไม่ถูกต้องหรือหมดอายุ','err'); return; }
    const s=POS.calc();
    if(p.minSpend&&s.sub<p.minSpend){ UI.toast('ยอดขั้นต่ำ '+STORE.baht(p.minSpend),'err'); return; }
    // ตรวจ happy hour: วัน+ช่วงเวลา
    if(p.type==='happyhour'){
      const d=new Date(), day=d.getDay(), hm=d.toTimeString().slice(0,5);
      if(!p.activeDays.includes(day)||hm<p.startTime||hm>p.endTime){ UI.toast('โค้ดนี้ใช้ได้ช่วง '+p.startTime+'-'+p.endTime,'err'); return; }
    }
    const label=p.code+(p.type==='amount'?' (-'+STORE.baht(p.value)+')':' (-'+p.value+'%)');
    POS.setDiscount({type:p.type,value:p.value,label}); UI.close('discOverlay'); UI.toast('ใช้โค้ด '+p.code,'ok');
  }
  return {quick,clear,applyCode};
})();

  }
  function setMethod(m){ method=m; cashIn=0; $$('#payModal .opt-chip').forEach(b=>b.classList.toggle('sel',b.dataset.m===m)); renderBody(); }
  function renderBody(){
    const total=POS.calc().total;
    if(method==='cash'){

      $('#payBody').innerHTML=`

        <div id="changeBox" style="text-align:center;font-size:18px;font-weight:700;color:var(--success);min-height:26px"></div>`;
    } else if(method==='promptpay'){
      const ppid=STORE.binfo().promptpayId;
      $('#payBody').innerHTML=`<div style="text-align:center">
        <div class="qr-box">${promptpayQR(total)}</div>
        <p style="margin-top:12px;font-size:14px">สแกนจ่าย <b>${STORE.baht(total)}</b><br><small style="color:var(--muted)">PromptPay: ${esc(ppid)}</small></p>
      </div>`;
    } else {
      $('#payBody').innerHTML=`<p style="text-align:center;padding:20px;color:var(--muted)">รับโอนเข้าบัญชีร้าน<br><b style="color:var(--text);font-size:18px">${STORE.baht(total)}</b><br>กดยืนยันเมื่อได้รับเงิน</p>`;
    }
  }
  function cash(v){ cashIn=STORE.toSatang(v); calcChange(); }
  function quickCash(v){ cashIn=v; const el=$('#cashIn'); if(el) el.value=(v/100); calcChange(); }
  function calcChange(){
    const total=POS.calc().total, ch=cashIn-total, box=$('#changeBox');
    if(!box) return;
    if(cashIn===0) box.textContent='';
    else if(ch<0) box.innerHTML=`<span style="color:var(--danger)">ขาดอีก ${STORE.baht(-ch)}</span>`;
    else box.innerHTML=`เงินทอน ${STORE.baht(ch)}`;
  }
  async function complete(){
    const s=POS.calc();
    if(method==='cash'&&cashIn<s.total){ UI.toast('รับเงินไม่พอ','err'); return; }
    const st=AUTH.get();
    const cart=POS.getCart(), member=POS.getMember(), discount=POS.getDiscount();
    const _rno=await CLOUD.nextNo('receipt');   // เลขใบเสร็จ atomic ฝั่ง server (fallback local ออฟไลน์)
    const order={
      id:STORE.uuid(), no:POS.getState().orderNo, receiptNo:_rno, branchId:STORE.bid(),
      type:POS.getType(), table:POS.getTable()||'',
      items:JSON.parse(JSON.stringify(cart)),
      subtotal:s.sub, discount:s.disc, discountLabel:discount?discount.label:'', vat:s.vat, service:s.service, total:s.total,
      method, paid:method==='cash'?cashIn:s.total, change:method==='cash'?cashIn-s.total:0,
      status:'preparing', memberId:member?member.id:null, staffId:st.id, staffName:st.name,
      channel:'pos', createdAt:STORE.now(), closedAt:null
    };
    STORE.get().orders.push(order);
    INV.deduct(order);                 // ตัดสต็อกตามสูตร
    if(member) MEMBER.earn(member,order); // สะสมแต้ม
    if(st){ st.sales=(st.sales||0)+s.total; } // ยอดต่อพนักงาน
    SHIFT.recordSale(order);           // บันทึกเข้ากะ
    if((STORE.get().settings.tgEvents||{}).sale!==false) LINEN.send(LINEN.saleMsg(order),'sale');
    else if(order.method==='promptpay') LINEN.send(LINEN.saleMsg(order),'payqr');
    else if(order.method==='transfer') LINEN.send(LINEN.saleMsg(order),'paytransfer');
    CLOUD.pushOrder(order);
    STORE.save();
    UI.close('payOverlay');
    receipt(order); if(order.method==='cash') PRINT.kickDrawer();  // แสดงใบเสร็จ
    autoPrint(order);                  // พิมพ์ใบเสร็จ + ใบครัว (รวมครั้งเดียว) ถ้าเปิดไว้
    POS.clearAfterPay();
    KDS.updateBadge();
    UI.toast('ขายสำเร็จ '+STORE.baht(s.total),'ok');
  }
  function receipt(order){
    const m=STORE.binfo(), items=order.items;
    const rows=items.map(it=>{
      const mt=it.mods.filter(x=>x.name!=='ปกติ').map(x=>x.name).join(', ');
      return `<tr><td>${esc(it.name)}${mt?'<br><small>+ '+esc(mt)+'</small>':''}</td><td style="text-align:center">${it.qty}</td><td style="text-align:right">${STORE.baht((it.base+it.modPrice)*it.qty)}</td></tr>`;
    }).join('');
    $('#genModal').className='modal';
    $('#genModal').innerHTML=`
      <div class="modal-h"><h3>🧾 ใบเสร็จ</h3><button class="x" onclick="UI.close('genOverlay')">×</button></div>
      <div class="modal-b"><div class="receipt" id="rcptPrint">
