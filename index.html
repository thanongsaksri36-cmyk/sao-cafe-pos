        <button class="btn-gold" onclick="PAY.print()">🖨️ พิมพ์</button>
      </div>`;
    UI.open('genOverlay');
  }
  function print(){
    const pw=STORE.get().settings.paperWidth||'80';   // 58 หรือ 80 mm
    const mm=pw==='58'?'58mm':'80mm', fs=pw==='58'?'11px':'12px';
    const html=$('#rcptPrint').outerHTML;
    const w=window.open('','_blank','width=380,height=600');
    w.document.write(`<html><head><title>ใบเสร็จ</title><style>@page{size:${mm} auto;margin:0}body{font-family:'Courier New','TH Sarabun New',monospace;font-size:${fs};width:${mm};margin:0 auto}.receipt{width:100%;margin:0}img,svg{max-width:100%}.rdiv{border-top:1px dashed #000;margin:8px 0}table{width:100%;border-collapse:collapse}td{padding:2px 0;font-size:${fs}}.rc{text-align:center}.rtot{font-weight:700}h3{font-size:16px;text-align:center}</style></head><body>${html}</body></html>`);
    w.document.close(); w.focus(); setTimeout(()=>{ try{ w.print(); w.onafterprint=()=>{try{w.close();}catch(e){}}; setTimeout(()=>{try{w.close();}catch(e){}},2000); }catch(e){} },300);
  }
  // สร้าง QR แบบ visual (ไม่ใช่ payload จริงตาม EMVCo แต่สแกนอ่านได้เป็น text) — ใช้ deterministic pattern
  // สร้าง QR PromptPay จริง: ใช้รูปที่อัปโหลดถ้ามี ไม่งั้นสร้างจากเบอร์/เลขบัตร+ยอด
  function promptpayQR(amountSatang){
    const st=STORE.get().settings, m=STORE.binfo();
    if(st.promptpayQrImg) return `<img src="${st.promptpayQrImg}" style="width:240px;height:240px;object-fit:contain">`;
    if(!m.promptpayId) return '<p style="color:var(--danger);font-size:13px">ยังไม่ได้ตั้งค่า PromptPay<br>(ไปที่ ตั้งค่า)</p>';
    try{
      const payload=ppPayload(m.promptpayId, amountSatang?amountSatang/100:null);
      const qr=qrcode(0,'M'); qr.addData(payload); qr.make();
      return qr.createSvgTag({cellSize:6,margin:2});  // ขนาด px คงที่ (ห้าม scalable ไม่งั้นยุบ 0)
    }catch(e){ return '<p style="color:var(--danger)">สร้าง QR ไม่ได้</p>'; }
  }
  function qrSvg(data){
    let h=0; for(let i=0;i<data.length;i++){ h=(h*31+data.charCodeAt(i))>>>0; }
    const n=25, cell=8; let rects='';
    const rand=(s)=>{ s=(s*9301+49297)%233280; return s/233280; };
    let seed=h;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){
      const finder=(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
      let on;
      if(finder){ const fx=x>=n-7?x-(n-7):x, fy=y>=n-7?y-(n-7):y; on=(fx===0||fx===6||fy===0||fy===6||(fx>=2&&fx<=4&&fy>=2&&fy<=4)); }
      else { seed=(seed*1103515245+12345)>>>0; on=(seed>>16&1)===1; }
      if(on) rects+=`<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}"/>`;
    }
    return `<svg width="200" height="200" viewBox="0 0 ${n*cell} ${n*cell}" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
  }
  function kitchenSlip(orderId){ const o=STORE.find('orders',orderId); if(o) KDS.serveSlip(o); }
  function fullTaxInvoice(orderId){
    const o=STORE.find('orders',orderId); if(!o) return;
    UI.ask('ใบกำกับภาษีเต็มรูป — ข้อมูลผู้ซื้อ',[
      {key:'name',label:'ชื่อผู้ซื้อ / บริษัท'},
      {key:'taxid',label:'เลขประจำตัวผู้เสียภาษีผู้ซื้อ'},
      {key:'addr',label:'ที่อยู่ผู้ซื้อ'}
    ],(b)=>renderFullTax(o,b));
  }
  function renderFullTax(o,buyer){
    const m=STORE.binfo(); const preVat=o.total-o.vat;
    const rows=o.items.map(it=>{ const mt=it.mods.filter(x=>x.name!=='ปกติ').map(x=>x.name).join(', '); const line=(it.base+it.modPrice)*it.qty; return `<tr><td>${esc(it.name)}${mt?' ('+esc(mt)+')':''}</td><td style="text-align:center">${it.qty}</td><td style="text-align:right">${STORE.baht(line)}</td></tr>`; }).join('');
    $('#genModal').className='modal wide';
    $('#genModal').innerHTML=`<div class="modal-h"><h3>🧾 ใบกำกับภาษีเต็มรูป</h3><button class="x" onclick="UI.close('genOverlay')">×</button></div>
      <div class="modal-b"><div id="rcptPrint" style="background:#fff;color:#000;padding:18px;font-size:13px;line-height:1.5">
        <div style="text-align:center"><b style="font-size:18px">${esc(m.shopName)}</b><br>ใบกำกับภาษี / ใบเสร็จรับเงิน (ต้นฉบับ)</div>
        <div style="margin-top:10px;border-top:1px solid #000;padding-top:8px"><b>ผู้ขาย:</b> ${esc(m.shopName)} ${esc(m.branchName||'')}<br>${m.address?esc(m.address)+'<br>':''}เลขผู้เสียภาษี: ${esc(m.taxId||'-')}</div>
        <div style="margin-top:8px"><b>ผู้ซื้อ:</b> ${esc(buyer.name||'-')}<br>${buyer.addr?esc(buyer.addr)+'<br>':''}เลขผู้เสียภาษี: ${esc(buyer.taxid||'-')}</div>
        <div style="margin-top:8px">เลขที่: ${esc(o.no)} (#${o.receiptNo}) · วันที่ ${new Date(o.createdAt).toLocaleString('th-TH')}</div>
        <table style="width:100%;border-collapse:collapse;margin-top:8px"><thead><tr><th style="text-align:left;border-bottom:1px solid #000">รายการ</th><th style="border-bottom:1px solid #000">จำนวน</th><th style="text-align:right;border-bottom:1px solid #000">จำนวนเงิน</th></tr></thead><tbody>${rows}</tbody></table>
        <table style="width:100%;border-collapse:collapse;margin-top:8px">
          ${o.discount>0?`<tr><td>ส่วนลด</td><td style="text-align:right">-${STORE.baht(o.discount)}</td></tr>`:''}
          <tr><td>มูลค่าสินค้า (ก่อน VAT)</td><td style="text-align:right">${STORE.baht(preVat)}</td></tr>
          <tr><td>ภาษีมูลค่าเพิ่ม ${m.vatRate}%</td><td style="text-align:right">${STORE.baht(o.vat)}</td></tr>
          <tr style="font-weight:700"><td>รวมทั้งสิ้น</td><td style="text-align:right">${STORE.baht(o.total)}</td></tr>
        </table>
        <div style="margin-top:26px;display:flex;justify-content:space-between"><div>...................<br>ผู้รับเงิน</div><div>...................<br>ผู้ซื้อ</div></div>
      </div></div>
      <div class="modal-f"><button class="btn-ghost" onclick="UI.close('genOverlay')">ปิด</button><button class="btn-gold" onclick="PAY.print()">🖨️ พิมพ์</button></div>`;
    UI.open('genOverlay');
  }
  // พิมพ์หลายใบในครั้งเดียว (เลี่ยงเบราว์เซอร์บล็อกหน้าต่างที่ 2)
  function printDocs(docs){
    if(!docs||!docs.length) return;
    const pw=STORE.get().settings.paperWidth||'80', mm=pw==='58'?'58mm':'80mm', fs=pw==='58'?'11px':'12px';
    const body=docs.map((d,i)=>`<div style="${i?'page-break-before:always;':''}">${d}</div>`).join('');
    const w=window.open('','_blank','width=380,height=600'); if(!w){ try{ UI.toast('⚠️ เบราว์เซอร์บล็อกหน้าต่างพิมพ์ — กดอนุญาต popup สำหรับเว็บนี้','err'); }catch(e){} return; }
    w.document.write(`<html><head><title>พิมพ์</title><style>@page{size:${mm} auto;margin:0}body{font-family:'Courier New','TH Sarabun New',monospace;font-size:${fs};width:${mm};margin:0 auto}.receipt{width:100%;margin:0}.rdiv{border-top:1px dashed #000;margin:8px 0}table{width:100%;border-collapse:collapse}td{padding:2px 0;font-size:${fs}}.rc{text-align:center}.rtot{font-weight:700}h3{font-size:16px;text-align:center;margin:0}img,svg{max-width:100%}</style></head><body>${body}</body></html>`);
    w.document.close(); w.focus(); setTimeout(()=>{ try{ w.print(); w.onafterprint=()=>{try{w.close();}catch(e){}}; setTimeout(()=>{try{w.close();}catch(e){}},2000); }catch(e){} },300);
  }
  function autoPrint(order){
    const st=STORE.get().settings; if(!st.autoPrint) return;
    if(st.printMethod==='bluetooth' && PRINT.connected()){ PRINT.escpos(order); return; }
    const docs=[]; const r=$('#rcptPrint'); if(r&&r.outerHTML) docs.push(r.outerHTML);   // ใบเสร็จ
    if(st.kdsServeSlip) docs.push(KDS.serveSlipHtml(order));                              // + ใบครัว (รวมพิมพ์ครั้งเดียว)
    setTimeout(()=>printDocs(docs),400);
  }
  return {open,setMethod,cash,quickCash,complete,print,printDocs,receipt,qrSvg,promptpayQR,fullTaxInvoice,kitchenSlip,autoPrint};
})();

/* ============================================================
   6. MEMBER — points, tier, redeem, history
   ============================================================ */
const MEMBER = (()=>{
  const TIERS=[{k:'bronze',t:'Bronze 🥉',min:0},{k:'silver',t:'Silver 🥈',min:100000},{k:'gold',t:'Gold 🥇',min:500000},{k:'platinum',t:'Platinum 💎',min:1500000}];
  function tierTh(k){ return (TIERS.find(t=>t.k===k)||TIERS[0]).t; }
  function tierFor(spent){ let r=TIERS[0]; TIERS.forEach(t=>{ if(spent>=t.min) r=t; }); return r.k; }
  function cfg(){ const s=STORE.get().settings; return {per:(s.ptEarnPerBaht!=null?s.ptEarnPerBaht:100), val:(s.ptValueBaht!=null?s.ptValueBaht:1)}; }
  function earn(member,order){
    const m=STORE.find('members',member.id); if(!m) return;
    const per=cfg().per; const pts=per>0?Math.floor(order.total/(per*100)):0;   // ใช้จ่ายทุก per บาท = 1 แต้ม
    m.points+=pts; m.totalSpent+=order.total; m.visits=(m.visits||0)+1;
    m.tier=tierFor(m.totalSpent);
    m.history=m.history||[]; m.history.push({orderId:order.id,total:order.total,points:pts,at:order.createdAt});
    STORE.save();
  }
  // ---- ปุ่มสมาชิกหน้าขาย: ค้นหา/สมัคร/แลกแต้ม-ของรางวัล ง่ายๆ ----
  function open(){
    const cur=POS.getMember();
    $('#genModal').className='modal';
    $('#genModal').innerHTML=`<div class="modal-h"><h3>👤 สมาชิก / สะสมแต้ม</h3><button class="x" onclick="UI.close('genOverlay')">×</button></div>
      <div class="modal-b">
        <div class="field"><label>เบอร์โทรลูกค้า</label>
          <div style="display:flex;gap:8px"><input id="memPhone" inputmode="numeric" placeholder="08x-xxx-xxxx" value="${cur?esc(cur.phone):''}" style="flex:1">
          <button class="btn-gold" style="padding:0 18px;border-radius:10px" onclick="MEMBER.find()">ค้นหา</button></div></div>
        <div id="memBox"></div>
      </div>`;
    UI.open('genOverlay'); if(cur) renderBox(cur);
  }
  function find(){
    const phone=($('#memPhone').value||'').trim(); if(!phone){ UI.toast('ใส่เบอร์โทร','err'); return; }
    const mem=STORE.get().members.find(x=>x.phone===phone&&!x.deletedAt);
    if(mem) renderBox(mem); else renderNew(phone);
  }
  function renderNew(phone){
    $('#memBox').innerHTML=`<div style="text-align:center;padding:14px;background:var(--surface-2);border-radius:12px">
      <p style="margin-bottom:10px">ไม่พบเบอร์ <b>${esc(phone)}</b><br><span style="color:var(--muted);font-size:13px">สมัครเป็นสมาชิกเลยไหม? (ฟรี)</span></p>
      <div class="field"><input id="memName" placeholder="ชื่อลูกค้า (เช่น คุณเอ)"></div>
      <div class="field"><input id="memBirth" placeholder="วันเกิด (เช่น 01/01) — ไว้รับโปรวันเกิด" inputmode="numeric"></div>
      <button class="btn-gold" style="width:100%;padding:12px;border-radius:10px" onclick="MEMBER.create('${esc(phone)}')">+ สมัครสมาชิกใหม่</button></div>`;
  }
  function create(phone){
    const name=($('#memName').value||'').trim()||'สมาชิกใหม่';
    const birthday=(($('#memBirth')||{}).value||'').trim();
    const mem={id:STORE.uuid(),phone,name,points:0,tier:'bronze',totalSpent:0,birthday,visits:0,history:[]};
    STORE.get().members.push(mem); STORE.save(); POS.setMember(mem); renderBox(mem); UI.toast('สมัครสมาชิกสำเร็จ ✅','ok');
  }
  function renderBox(mem){
    const c=cfg(); const rewards=(STORE.get().settings.rewards||[]);
    $('#memBox').innerHTML=`<div style="background:var(--surface-2);border-radius:12px;padding:14px;margin-top:6px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><b style="font-size:16px">${esc(mem.name)}</b><div style="color:var(--muted);font-size:12px">${esc(mem.phone)} · ${tierTh(mem.tier)}</div></div>
        <div style="text-align:right"><div style="font-size:26px;font-weight:800;color:var(--gold)">${mem.points}</div><div style="font-size:11px;color:var(--muted)">แต้ม</div></div>
      </div>
      <button class="btn-gold" style="width:100%;padding:11px;border-radius:10px;margin-top:10px" onclick="MEMBER.use('${mem.id}')">✓ ใช้สมาชิกนี้กับบิล</button>
      ${birthdayEligible(mem)?`<button class="btn-gold" style="width:100%;padding:11px;border-radius:10px;margin-top:8px;background:var(--danger)" onclick="MEMBER.applyBirthday('${mem.id}')">🎂 ใช้ส่วนลดวันเกิด (${birthdayLabel()})</button>`:''}
      <div style="border-top:1px dashed var(--line);margin:12px 0 8px"></div>
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">แลกแต้มเป็นส่วนลด (1 แต้ม = ฿${c.val})</div>
      <div style="display:flex;gap:8px"><input id="memRedeemPts" type="number" inputmode="numeric" placeholder="จำนวนแต้ม" style="flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)">
        <button class="btn-gold" style="padding:0 16px;border-radius:10px" onclick="MEMBER.redeemPts('${mem.id}')">แลก</button></div>
      ${rewards.length?`<div style="font-size:13px;font-weight:600;margin:14px 0 8px">🎁 แลกของรางวัล</div>
        ${rewards.map(r=>`<div class="disc-opt" onclick="MEMBER.redeemReward('${mem.id}','${r.id}')"><span>${esc(r.name)}</span><span style="color:var(--gold);font-weight:600">${r.points} แต้ม</span></div>`).join('')}`:''}
    </div>`;
  }
  function bp(){ return STORE.get().settings.birthdayPromo||{value:0}; }
  function birthdayEligible(mem){
    const b=bp(); if(!b||!(b.value>0)||!mem.birthday) return false;
    const p=mem.birthday.split('/'); const d=parseInt(p[0]), mo=parseInt(p[1]); const t=new Date();
    if(isNaN(mo)) return false;
    if((b.mode||'month')==='day') return d===t.getDate() && mo===(t.getMonth()+1);
    return mo===(t.getMonth()+1);   // ทั้งเดือนเกิด
  }
  function birthdayLabel(){ const b=bp(); return b.type==='amount'?('ลด ฿'+b.value):('ลด '+b.value+'%'); }
  function applyBirthday(id){
    const m=STORE.find('members',id), b=bp(); if(!m||!(b.value>0)) return;
    POS.setMember(m);
    POS.setDiscount({type:b.type, value:b.type==='amount'?STORE.toSatang(b.value):b.value, label:'🎂 วันเกิด'});
    UI.close('genOverlay'); UI.toast('ใช้ส่วนลดวันเกิด '+birthdayLabel()+' 🎂','ok');
  }
  function use(id){ const m=STORE.find('members',id); if(m){ POS.setMember(m); UI.close('genOverlay'); UI.toast('ใช้สมาชิก '+m.name,'ok'); } }
  function redeemPts(id){
    const m=STORE.find('members',id); if(!m) return;
    const pts=parseInt(($('#memRedeemPts').value||'0'))||0;
    if(pts<=0){ UI.toast('ใส่จำนวนแต้ม','err'); return; }
    if(m.points<pts){ UI.toast('แต้มไม่พอ (มี '+m.points+')','err'); return; }
    const baht=pts*cfg().val; m.points-=pts; STORE.save();
    POS.setMember(m); POS.setDiscount({type:'points',value:Math.round(baht*100),label:'แลก '+pts+' แต้ม'});
    UI.close('genOverlay'); UI.toast('แลก '+pts+' แต้ม = ลด ฿'+baht,'ok');
  }
  function redeemReward(id,rid){
    const m=STORE.find('members',id); const r=(STORE.get().settings.rewards||[]).find(x=>x.id===rid); if(!m||!r) return;
    if(m.points<r.points){ UI.toast('แต้มไม่พอ (ต้องการ '+r.points+')','err'); return; }
    m.points-=r.points; STORE.save();
    POS.setMember(m); POS.setDiscount({type:'points',value:r.discount,label:'🎁 '+r.name});
    UI.close('genOverlay'); UI.toast('แลก: '+r.name,'ok');
  }
  function redeem(){
    const m=POS.getMember(); if(!m){ UI.toast('เลือกสมาชิกก่อน','err'); return; }
    const mem=STORE.find('members',m.id);
    if(mem.points<50){ UI.toast('แต้มไม่พอ (ต้องการ 50)','err'); return; }
    mem.points-=50; STORE.save();
    POS.setDiscount({type:'points',value:5000,label:'แลก 50 แต้ม'});
    POS.setMember(mem); DISC.showMember(mem); UI.toast('แลกแต้มสำเร็จ ลด ฿50','ok');
  }
  return {tierTh,tierFor,earn,redeem,open,find,create,renderBox,use,redeemPts,redeemReward,birthdayEligible,applyBirthday,TIERS};
})();

/* ============================================================
   7. INV — recipe (BOM) deduction, restock, low-stock alert
   ============================================================ */
const INV = (()=>{
  function isLow(product){
    if(!product.recipe||!product.recipe.length) return false;
    return product.recipe.some(r=>{ const ig=STORE.find('ingredients',r.ingredientId); return ig&&ig.stock<ig.parLevel; });
  }
  function outOfStock(product){
    if(!product.recipe||!product.recipe.length) return false;
    return product.recipe.some(r=>{ const ig=STORE.find('ingredients',r.ingredientId); return ig&&ig.stock<r.qty; });
  }
  function deduct(order){
    order.items.forEach(it=>{
      const p=STORE.find('products',it.productId);
      if(p&&p.recipe) p.recipe.forEach(r=>{ const ig=STORE.find('ingredients',r.ingredientId); if(ig) ig.stock=Math.max(0,ig.stock-r.qty*it.qty); });
    });
    STORE.save();
    // แจ้งเตือนวัตถุดิบใกล้หมด
    const low=STORE.scoped('ingredients').filter(i=>i.stock<i.parLevel&&!i.deletedAt);
    if(low.length) UI.toast('⚠️ วัตถุดิบใกล้หมด: '+low.map(i=>i.name).slice(0,2).join(', '),'err');
    const _today=new Date().toDateString();
    const fresh=low.filter(i=>i._lowDay!==_today);
    if(fresh.length){ fresh.forEach(i=>{ i._lowDay=_today; }); STORE.save();
      LINEN.send('📉 วัตถุดิบถึงจุดสั่งซื้อ: '+fresh.map(i=>i.name+' (เหลือ '+i.stock+i.unit+')').slice(0,5).join(', '),'lowstock'); }
  }
  function restock(id,amount){ const ig=STORE.find('ingredients',id); if(ig){ ig.stock+=amount; STORE.save(); } }
  function lowList(){ return STORE.scoped('ingredients').filter(i=>i.stock<i.parLevel&&!i.deletedAt); }
  // คำนวณต้นทุนต่อแก้วใหม่ทุกเมนู จากราคาวัตถุดิบล่าสุด (เรียกเมื่อราคาวัตถุดิบเปลี่ยน)
  function recalcCosts(){
    STORE.get().products.forEach(p=>{ if(p.recipe&&p.recipe.length){ let c=0; p.recipe.forEach(r=>{ const ig=STORE.find('ingredients',r.ingredientId); if(ig) c+=(ig.cost||0)*r.qty; }); if(c>0) p.cost=Math.round(c); } });
  }
  return {isLow,outOfStock,deduct,restock,lowList,recalcCosts};
})();

/* ============================================================
   8. KDS — kitchen display, bump/recall, timers
   ============================================================ */
const KDS = (()=>{
  function active(){ return STORE.get().orders.filter(o=>(o.status==='preparing'||o.status==='ready')&&(o.branchId||'BR-001')===STORE.bid()); }
  function render(){
    const orders=active().sort((a,b)=>a.createdAt-b.createdAt);
    if(!orders.length){ $('#kdsCols').innerHTML=`<div class="empty" style="color:#cfd8d0;margin:auto"><div class="ic">👨‍🍳</div>ยังไม่มีออเดอร์ในครัว</div>`; return; }
    $('#kdsCols').innerHTML=orders.map(o=>{
      const mins=(STORE.now()-o.createdAt)/60000;
      const cls=mins>10?'late':mins>5?'warn':'';
      const items=o.items.map((it,i)=>{
        const mt=it.mods.filter(x=>x.name!=='ปกติ').map(x=>x.name).join(', ');
        const done=(o.itemDone||[]).includes(i);
        return `<div class="kitem ${done?'done':''}" onclick="KDS.toggleItem('${o.id}',${i})"><span class="kq">${it.qty}×</span><div style="flex:1;min-width:0"><b>${esc(it.name)}</b>${mt?`<div class="kmods">${esc(mt)}</div>`:''}</div><span class="kchk">${done?'✓':''}</span></div>`;
      }).join('');
      return `<div class="ticket ${cls}">
        <div class="ticket-h"><b>${esc(o.no)}</b><span class="ticket-type">${({'dine-in':'ร้าน','takeaway':'กลับ','delivery':'ส่ง'})[o.type]}</span>${o.table?`<span class="ticket-type" style="background:var(--gold)">🪑${esc(o.table)}</span>`:''}<span class="tmr" data-at="${o.createdAt}">${mmss(mins)}</span></div>
        <div class="ticket-items">${items}</div>
        <div class="ticket-foot">
          ${o.status==='preparing'?`<button class="btn-gold" onclick="KDS.setStatus('${o.id}','ready')">✓ เสร็จ</button>`
            :`<button class="btn-ghost" onclick="KDS.setStatus('${o.id}','preparing')">↩ ทำต่อ</button><button class="btn-gold" onclick="KDS.setStatus('${o.id}','done')">🍽️ เสิร์ฟ</button>`}
        </div>
      </div>`;
    }).join('');
  }
  function mmss(mins){ const t=Math.max(0,Math.floor(mins*60)); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
  function toggleItem(oid,idx){
    const o=STORE.find('orders',oid); if(!o) return;
    o.itemDone=o.itemDone||[];
    o.itemDone=o.itemDone.includes(idx)?o.itemDone.filter(i=>i!==idx):[...o.itemDone,idx];
    STORE.save(); CLOUD.pushOrder(o); render();
  }
  function setStatus(oid,st){
    const o=STORE.find('orders',oid); if(!o) return;
    o.status=st; if(st==='done') o.closedAt=STORE.now();
    STORE.save(); CLOUD.pushOrder(o); render(); updateBadge();
    if(st==='ready') UI.toast(o.no+' พร้อมเสิร์ฟ','ok');
  }
  // ใบเสิร์ฟ: พิมพ์รายการในออเดอร์ ไว้ให้พนักงานเสิร์ฟ+ทวนลูกค้า (เปิด/ปิดได้ในตั้งค่า)
  function serveSlipHtml(o){
    const m=STORE.get().meta;
    const items=o.items.map(it=>{ const mt=it.mods.filter(x=>x.name!=='ปกติ').map(x=>x.name).join(', '); return `<div style="padding:5px 0;border-bottom:1px dashed #000"><b style="font-size:15px">${it.qty}× ${esc(it.name)}</b>${mt?'<br><small>+ '+esc(mt)+'</small>':''}${it.note?'<br><small>หมายเหตุ: '+esc(it.note)+'</small>':''}</div>`; }).join('');
    const tp=({'dine-in':'ทานที่ร้าน','takeaway':'กลับบ้าน','delivery':'เดลิเวอรี่'})[o.type]||'';
    const where=o.type==='dine-in'?(o.table?'โต๊ะ '+esc(o.table):'ทานที่ร้าน'):tp;
    return `<div class="receipt"><div class="rc"><h3>🍽️ ใบครัว</h3></div>`+
      `<div class="rc" style="font-size:22px;font-weight:800;margin:2px 0 4px">${where}</div>`+
      `<div class="rc" style="font-size:13px">${esc(o.no)} · ${new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</div><div class="rdiv"></div>${items}<div class="rdiv"></div><div class="rc">ทวนกับลูกค้า ✓</div></div>`;
  }
  function serveSlip(o){ PAY.printDocs([serveSlipHtml(o)]); }
  function updateBadge(){
    const n=active().length, b=$('#kdsBdg');
    if(b){ b.textContent=n; b.classList.toggle('hidden',n===0); }
    try{ UI.updateHamBadge(); }catch(e){}
  }
  function tick(){ if(NAV.cur()==='kds') $$('.tmr').forEach(el=>{ const at=+el.dataset.at; el.textContent=mmss((STORE.now()-at)/60000); }); }
  return {render,toggleItem,setStatus,updateBadge,tick,active,serveSlip,serveSlipHtml};
})();

        ${cats.map(c=>`<button class="qrc-cat ${qcat===c.id?'active':''}" onclick="QR.cat('${c.id}')">${esc(c.name)}</button>`).join('')}
      </div>

        <button class="qrc-arrow l" id="qrcPrev" onclick="QR.prev()">‹</button>
        <button class="qrc-arrow r" id="qrcNext" onclick="QR.next()">›</button>

        ${items.length?items.map(p=>{
          const inCart=(qcart.find(c=>c.productId===p.id)||{}).qty||0;
          return `<div class="qrc-slide" onclick="QR.goTo(${items.indexOf(p)})"><div class="qrc-card">
            <div class="qrc-hero">${p.img?`<img src="${esc(p.img)}">`:`<div class="em">${esc(p.emoji||'☕')}</div>`}
              <span class="catbadge">${esc(catName(p.cat))}</span>
              <span class="incart" id="qrcBadge_${p.id}" ${inCart?'':'style="display:none"'}>×${inCart}</span></div>
            <div class="qrc-info">
              <div class="nm">${esc(p.name)}</div>
              <div class="ds">${esc(p.desc||'หอม กลมกล่อม สดใหม่ทุกแก้ว')}</div>
              <div class="row"><div class="pr">${STORE.baht(p.price)}</div>
                <button class="qrc-addbtn" onclick="event.stopPropagation();QR.add('${p.id}')">＋ เพิ่ม</button></div>
            </div>
          </div></div>`;
        }).join(''):`<div class="qrc-slide"><div class="empty"><div class="ic">🍽️</div>ยังไม่มีเมนูในหมวดนี้</div></div>`}
        </div>
      </div>
      <div class="qrc-counter" id="qrcCounter"></div>
      <div class="qrc-dots" id="qrcDots"></div>
      <div id="qrcBar"></div>`;
    updateCarousel(); renderBar(); bindSwipe(); window.onresize=()=>updateCarousel();
  }
  function updateCarousel(){
    const stage=$('#qrcStage'), track=$('#qrcTrack');
    if(stage&&track&&track.children&&track.children.length){
      // วางใบปัจจุบันไว้กึ่งกลางจอ ใบก่อนหน้า/ถัดไปจะโผล่ซ้าย-ขวา (เห็นจางๆ)
      const sw=track.children[0].getBoundingClientRect().width||stage.clientWidth;
      const offset=(stage.clientWidth - sw)/2 - idx*sw;
      track.style.transform=`translateX(${offset}px)`;
      Array.prototype.forEach.call(track.children,(el,i)=>el.classList.toggle('active',i===idx));
    }
    const prev=$('#qrcPrev'), next=$('#qrcNext');
    if(prev) prev.classList.toggle('dis',idx<=0);
    if(next) next.classList.toggle('dis',idx>=items.length-1);
    const dots=$('#qrcDots');
    if(dots) dots.innerHTML=items.map((_,i)=>`<span class="qrc-dot ${i===idx?'on':''}"></span>`).join('');
    const ct=$('#qrcCounter');
    if(ct) ct.textContent=items.length?`${idx+1} / ${items.length}`:'';
  }
  function goTo(i){ if(i>=0&&i<items.length&&i!==idx){ idx=i; updateCarousel(); } }
  function next(){ if(idx<items.length-1){ idx++; updateCarousel(); } }
  function prev(){ if(idx>0){ idx--; updateCarousel(); } }
  // ปัดนิ้วซ้าย-ขวาเพื่อเลื่อนเมนู
  function bindSwipe(){
    const st=$('#qrcStage'); if(!st) return;
    st.ontouchstart=(e)=>{ touchX=e.touches[0].clientX; touchY=e.touches[0].clientY; };
    st.ontouchend=(e)=>{
      if(touchX===null) return;
      const dx=e.changedTouches[0].clientX-touchX, dy=e.changedTouches[0].clientY-touchY;
      if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){ dx<0?next():prev(); }

    const icon=open?'🍳':'🧾';

    const note=open?'ขอบคุณค่ะ พบกันตอนชำระเงิน 😊':'ออเดอร์จะเข้าครัวหลังพนักงานยืนยันการชำระเงิน';
    $('#qrRoot').innerHTML=`<div style="margin:auto;text-align:center;padding:40px">
      <div style="font-size:72px">${icon}</div>

      <p style="font-size:20px">ออเดอร์ <b style="color:var(--gold)">${esc(order.no)}</b>${order.table?' · โต๊ะ '+esc(order.table):''}</p>
      <p style="color:var(--muted);margin:10px 0 26px">${msg}<br>ยอดรวม <b>${STORE.baht(order.total)}</b><br><small>${note}</small></p>
      <button class="qrc-checkout" style="max-width:240px;margin:0 auto" onclick="QR.render()">สั่งเพิ่ม</button>
    </div>`;
  }
  return {render,cat,add,checkout,next,prev,goTo,chQty,setTable,toPay,payBy,submitOrder,confirmOrder,submitOpenTab,startCustomer};
})();

/* ============================================================
   PENDING — คิวรอชำระเงิน (Cashier) สำหรับออเดอร์ QR
   ============================================================ */
const PENDING = (()=>{
  // ---- 🔔 เสียงเตือนออเดอร์ QR (สร้างเสียงด้วย WebAudio ไม่ต้องมีไฟล์/เน็ต) ----
  let unseen=0, sndTimer=null, ac=null;
  function beep(){
    if(STORE.get().settings.sndQR===false) return;
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended') ac.resume();
      const t0=ac.currentTime;
      [[988,0],[1319,.18],[988,.4],[1319,.58]].forEach(([fq,dt])=>{
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='sine'; o.frequency.value=fq; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(.0001,t0+dt); g.gain.exponentialRampToValueAtTime(.6,t0+dt+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.17);
        o.start(t0+dt); o.stop(t0+dt+.2);
      });
    }catch(e){}
  }
  let rounds=0;
  let thVoice=null;
  function loadVoices(){
    try{
      const vs=(window.speechSynthesis&&window.speechSynthesis.getVoices())||[];
      thVoice=vs.find(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith('th'))||null;
    }catch(e){}
  }
  try{ if(window.speechSynthesis){ loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices; } }catch(e){}
  function speak(){                                     // เสียงพูดไทย (Web Speech API)
    try{
      if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
      loadVoices();
      window.speechSynthesis.cancel();
      setTimeout(()=>{ try{
        const u=new window.SpeechSynthesisUtterance('มีออเดอร์เข้า รบกวนตรวจสอบออเดอร์ด้วยครับ');
        u.lang=(thVoice&&thVoice.lang)||'th-TH'; if(thVoice) u.voice=thVoice;
        u.rate=1; u.volume=1; u.pitch=1;
        window.speechSynthesis.resume(); window.speechSynthesis.speak(u);
      }catch(e){} },150);                               // Chrome กลืนเสียงถ้า speak ติด cancel ทันที
    }catch(e){}
  }
  function voiceInfo(){ loadVoices(); return thVoice?('✅ มีเสียงพูดไทย: '+thVoice.name):'⚠️ เครื่องนี้ไม่มีเสียงพูดไทย — จะได้ยินแค่ติ๊ง (ดูวิธีเพิ่มในคู่มือ/แชต)'; }
  function testVoice(){ ring(); }
  function ring(){                                      // ติ๊งเรียกความสนใจ -> พูดไทยต่อ
    if(STORE.get().settings.sndQR===false) return;
    beep(); setTimeout(speak,450);
  }
  function alertNew(){                                  // ออเดอร์ QR ใหม่เข้า
    unseen++; updateBadge(); rounds=1; ring();
    try{ UI.toast('🛎️ ออเดอร์ใหม่จากลูกค้าสแกนสั่ง!','ok'); }catch(e){}
    if(!sndTimer) sndTimer=setInterval(()=>{ if(unseen>0&&rounds<3){ rounds++; ring(); } else seen(); },20000);  // สูงสุด 3 รอบ หรือจนกว่าแตะจอ/เปิดดู
  }
  function seen(){
    unseen=0; rounds=0; if(sndTimer){ clearInterval(sndTimer); sndTimer=null; }
    try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  }
  try{ document.addEventListener('pointerdown',()=>{ if(unseen>0) seen(); },true); }catch(e){}   // แคชเชียร์แตะจอ = รับทราบ หยุดเสียง
  try{ if(window.speechSynthesis) window.speechSynthesis.getVoices(); }catch(e){}                 // โหลดรายชื่อเสียงล่วงหน้า
  function waitList(){ return STORE.get().orders.filter(o=>o.status==='wait_payment'&&(o.branchId||'BR-001')===STORE.bid()); }
  function openTabs(){ return STORE.get().orders.filter(o=>o.payStatus==='open'&&o.status!=='void'&&(o.branchId||'BR-001')===STORE.bid()); }
  function methodPill(m){ return m==='cash'?'<span class="pill lo">💵 เงินสด</span>':m==='transfer'?'<span class="pill ok">🏦 โอน</span>':'<span class="pill ok">📱 PromptPay</span>'; }
  function card(o,kind){
    const head=o.table?'🪑 โต๊ะ '+esc(o.table):esc(o.no);
    const items=o.items.map(it=>esc(it.qty+'× '+it.name)).join(', ');
    const actions = kind==='wait'
      ? `<button class="btn btn-pay" style="flex:2;padding:11px" onclick="PENDING.confirm('${o.id}')">✅ รับเงินแล้ว → ครัว</button>
         <button class="btn btn-danger" style="flex:1;padding:11px" onclick="PENDING.cancel('${o.id}')">ยกเลิก</button>`
      : `<button class="btn btn-pay" style="flex:1 1 100%;padding:11px;background:var(--gold)" onclick="PENDING.settle('${o.id}')">💰 ปิดบิล · รับเงิน</button>
         <button class="btn btn-ghost" style="flex:1;padding:10px" onclick="PENDING.moveTable('${o.id}')">🔀 ย้ายโต๊ะ</button>
         <button class="btn btn-danger" style="flex:1;padding:10px" onclick="PENDING.cancel('${o.id}')">ยกเลิก</button>`;
    const border = kind==='wait' ? (o.method==='cash'?'var(--warn)':'var(--gold)') : 'var(--success)';
    const tag = kind==='wait' ? methodPill(o.method) : '<span class="pill lo">ค้างชำระ</span>';
    return `<div class="stat-card" style="border-left:5px solid ${border}">
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">${head}</b>${tag}</div>
      <div style="font-size:13px;color:var(--muted);margin:8px 0;line-height:1.5">${items}</div>
      <div class="sr tot" style="margin:6px 0 12px"><span>ยอด</span><span>${STORE.baht(o.total)}</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${actions}</div></div>`;
  }
  function render(){
    seen();                                             // เปิดหน้านี้ = รับทราบแล้ว หยุดเสียงซ้ำ
    const waiting=waitList().sort((a,b)=>a.createdAt-b.createdAt);
    const tabs=openTabs().sort((a,b)=>a.createdAt-b.createdAt);
    $('#pendingPanel').innerHTML=`
      <div class="panel-head"><h2>📥 รอชำระเงิน (จากลูกค้าสแกนสั่ง)</h2></div>
      <h3 style="font-size:15px;margin:6px 0 10px">⏳ รอชำระก่อนเข้าครัว</h3>
      ${waiting.length?`<div class="cards-row" style="grid-template-columns:repeat(auto-fill,minmax(270px,1fr))">${waiting.map(o=>card(o,'wait')).join('')}</div>`:'<div class="empty" style="padding:18px">— ไม่มี —</div>'}
      <h3 style="font-size:15px;margin:22px 0 10px">🍽️ โต๊ะค้างชำระ (จ่ายตอนกลับ)</h3>
      ${tabs.length?`<div class="cards-row" style="grid-template-columns:repeat(auto-fill,minmax(270px,1fr))">${tabs.map(o=>card(o,'tab')).join('')}</div>`:'<div class="empty" style="padding:18px">— ไม่มี —</div>'}`;
  }
  function confirm(id){
    const o=STORE.find('orders',id); if(!o) return;
    o.status='preparing'; o.payStatus='paid'; o.paid=o.total;
    INV.deduct(o); STORE.save(); CLOUD.pushOrder(o); if(STORE.get().settings.kdsServeSlip) KDS.serveSlip(o); KDS.updateBadge(); updateBadge(); render();
    if((STORE.get().settings.tgEvents||{}).sale!==false) LINEN.send(LINEN.saleMsg(o),'sale');
    UI.toast('รับเงินแล้ว ส่งเข้าครัว '+(o.table?'โต๊ะ '+o.table:o.no),'ok');
  }
  function settle(id){
    const o=STORE.find('orders',id); if(!o) return;
    $('#genModal').className='modal';
    $('#genModal').innerHTML=`<div class="modal-h"><h3>ปิดบิล ${o.table?'โต๊ะ '+esc(o.table):esc(o.no)} · ${STORE.baht(o.total)}</h3><button class="x" onclick="UI.close('genOverlay')">×</button></div>
      <div class="modal-b"><p style="color:var(--muted);font-size:13px;margin-bottom:12px">เลือกวิธีรับชำระ</p>
      <div class="opt-chips">
        <button class="opt-chip" onclick="PENDING.settlePay('${o.id}','cash')">💵 เงินสด</button>
        <button class="opt-chip" onclick="PENDING.settleQR('${o.id}','promptpay')">📱 PromptPay</button>
        <button class="opt-chip" onclick="PENDING.settleQR('${o.id}','transfer')">🏦 โอน</button>
      </div></div>`;
    UI.open('genOverlay');
  }
  function settleQR(id,method){
    const o=STORE.find('orders',id); if(!o) return;
    $('#genModal').className='modal';
    $('#genModal').innerHTML=`<div class="modal-h"><h3>${method==='promptpay'?'📱 สแกนจ่าย':'🏦 โอนเงิน'} · ${STORE.baht(o.total)}</h3><button class="x" onclick="UI.close('genOverlay')">×</button></div>
      <div class="modal-b" style="text-align:center">
        <div class="qr-box">${PAY.promptpayQR(o.total)}</div>
        <p style="margin:12px 0;font-size:13px;color:var(--muted)">ให้ลูกค้าสแกนจ่าย <b>${STORE.baht(o.total)}</b><br>${STORE.get().settings.promptpayQrImg?'<b style="color:var(--warn)">⚠️ กรอกยอดเอง</b>':'PromptPay: '+esc(STORE.binfo().promptpayId||'-')+' (ยอดขึ้นอัตโนมัติ)'}</p>
        <button class="btn btn-pay" style="width:100%" onclick="PENDING.settlePay('${o.id}','${method}')">✅ รับเงินแล้ว · ปิดบิล</button>
      </div>`;
    UI.open('genOverlay');
  }
  function settlePay(id,method){
    const o=STORE.find('orders',id); if(!o) return;
    o.method=method; o.payStatus='paid'; o.paid=o.total; if(!o.closedAt&&o.status==='done') o.closedAt=STORE.now();
    STORE.save(); CLOUD.pushOrder(o); UI.close('genOverlay'); updateBadge(); render();
    if((STORE.get().settings.tgEvents||{}).sale!==false) LINEN.send(LINEN.saleMsg(o),'sale');
    UI.toast('ปิดบิลแล้ว '+(o.table?'โต๊ะ '+o.table:o.no)+' · '+STORE.baht(o.total),'ok');
  }
  function cancel(id){
    const o=STORE.find('orders',id); if(!o) return;
    UI.confirm2('ยกเลิกออเดอร์','ยกเลิก '+(o.table?'โต๊ะ '+o.table:o.no)+'?',()=>{
      // ถ้าเคยเข้าครัว (ตัดสต็อกแล้ว) ให้คืนสต็อก
      if(o.payStatus==='open'||o.status==='preparing'||o.status==='ready'){ (o.items||[]).forEach(it=>{ const p=STORE.find('products',it.productId); if(p&&p.recipe) p.recipe.forEach(r=>{ const ig=STORE.find('ingredients',r.ingredientId); if(ig) ig.stock+=r.qty*it.qty; }); }); }
      o.status='void'; o.voidReason='ยกเลิก/ไม่ชำระ'; o.closedAt=STORE.now(); STORE.save(); CLOUD.pushOrder(o); KDS.updateBadge(); updateBadge(); render();
      LINEN.send(LINEN.voidMsg(o,'ยกเลิก/ไม่ชำระ'),'voided');
    },true);
  }
  function moveTable(id){
    const o=STORE.find('orders',id); if(!o) return;
    const tables=STORE.scoped('tables').filter(t=>t.active&&!t.deletedAt&&t.name!==o.table);
    $('#genModal').className='modal';
    $('#genModal').innerHTML=`<div class="modal-h"><h3>🔀 ย้ายโต๊ะ${o.table?' (จากโต๊ะ '+esc(o.table)+')':''}</h3><button class="x" onclick="UI.close('genOverlay')">×</button></div>
      <div class="modal-b"><p style="color:var(--muted);font-size:13px;margin-bottom:10px">เลือกโต๊ะปลายทาง · ถ้าโต๊ะนั้นมีบิลค้างอยู่ ระบบจะถามรวมบิล</p>
      <div class="opt-chips">${tables.length?tables.map(t=>`<button class="opt-chip" onclick="PENDING.moveTo('${o.id}','${t.name}')">${esc(t.name)}</button>`).join(''):'<span style="color:var(--muted)">ไม่มีโต๊ะอื่น</span>'}</div></div>`;
    UI.open('genOverlay');
  }
  function moveTo(id,name){
    const o=STORE.find('orders',id); if(!o) return;
    UI.close('genOverlay');
    const target=openTabs().find(x=>x.id!==id&&x.table===name);   // โต๊ะปลายทางมีบิลค้างไหม
    if(target){
      UI.confirm2('รวมบิล?','โต๊ะ '+name+' มีบิลค้างอยู่แล้ว · รวมรายการเข้าด้วยกันเป็นบิลเดียว?',()=>{ merge(target,o); render(); UI.toast('รวมบิลที่โต๊ะ '+name,'ok'); });
    } else {
      o.table=name; STORE.save(); CLOUD.pushOrder(o); KDS.updateBadge(); render(); UI.toast('ย้ายไปโต๊ะ '+name,'ok');
    }
  }
  function merge(target,src){
    // รวมรายการ src เข้า target (อาหารยังต้องทำ จึงไม่คืนสต็อก)
    target.items=target.items.concat(src.items);
    target.subtotal=target.items.reduce((s,it)=>s+(it.base+it.modPrice)*it.qty,0);
    target.total=target.subtotal;
    src.status='void'; src.voidReason='รวมบิลไปโต๊ะ '+(target.table||target.no); src.closedAt=STORE.now();
    STORE.save(); CLOUD.pushOrder(target); CLOUD.pushOrder(src); KDS.updateBadge(); updateBadge();
  }
  function updateBadge(){ const b=$('#pendingBdg'); if(b){ const nn=waitList().length+openTabs().length; b.textContent=nn; b.classList.toggle('hidden',nn===0); } try{ UI.updateHamBadge(); }catch(e){} }
  return {render,confirm,settle,settleQR,settlePay,cancel,moveTable,moveTo,updateBadge,waitList,openTabs,alertNew,seen,beep,testVoice,voiceInfo};
})();

/* ============================================================
   9. REPORT — daily sales, top items, gross profit, X/Z, export
   ============================================================ */
const REPORT = (()=>{
  let period='today', branchFilter=null;
  function isHQ(){ return AUTH.isHQ(); }
  function curBF(){ if(branchFilter===null) branchFilter=STORE.bid(); if(!isHQ()) branchFilter=STORE.bid(); return branchFilter; }
  function inBranch(o){ const bf=curBF(); return bf==='all'?true:(o.branchId||'BR-001')===bf; }
  function bfLabel(){ const bf=curBF(); if(bf==='all') return 'ทุกสาขารวม'; const b=(STORE.get().branches||[]).find(x=>x.id===bf); return b?b.name:bf; }
  function inPeriod(o){
    const d=new Date(o.createdAt), now=new Date();
    if(period==='today') return d.toDateString()===now.toDateString();
    if(period==='week'){ const diff=(now-d)/86400000; return diff<=7; }
    if(period==='month') return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    return true;
  }
  function sales(){ return STORE.get().orders.filter(o=>o.status!=='void'&&o.method!=='unpaid'&&inPeriod(o)&&inBranch(o)); }
  function render(){
    const orders=sales();
    const revenue=orders.reduce((s,o)=>s+o.total,0);
    const count=orders.length;
    const avg=count?Math.round(revenue/count):0;
    const prepArr=orders.map(prepMs).filter(x=>x!=null);
    const avgPrep=prepArr.length?Math.round(prepArr.reduce((a,b)=>a+b,0)/prepArr.length):null;
    // กำไรขั้นต้น = ยอด - ต้นทุน (cost) ของสินค้า
    let cost=0;
    orders.forEach(o=>o.items.forEach(it=>{ const p=STORE.find('products',it.productId); if(p) cost+=p.cost*it.qty; }));
    const profit=revenue-cost;
    // ค่าใช้จ่ายคงที่ (ต่อเดือน) เฉลี่ยตามจำนวนวันของช่วงที่เลือก
    const fixedMonthly=(STORE.get().settings.fixedCosts||[]).filter(fc=> curBF()==='all'?true:(fc.branchId||'BR-001')===curBF()).reduce((a,b)=>a+(b.amount||0),0);
    let days=1;
    if(period==='today') days=1; else if(period==='week') days=7; else if(period==='month') days=30;
    else { const ds=orders.map(o=>o.createdAt); days=ds.length?Math.max(1,Math.ceil((Date.now()-Math.min(...ds))/86400000)):1; }
    const fixedShare=Math.round(fixedMonthly/30*days);
    const netProfit=profit-fixedShare;
    // สินค้าขายดี
    const tally={};
    orders.forEach(o=>o.items.forEach(it=>{ tally[it.name]=(tally[it.name]||0)+it.qty; }));
    const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,6);
    const maxQ=top.length?top[0][1]:1;
    // แยกตามวิธีจ่าย
    const byMethod={};
    orders.forEach(o=>{ byMethod[o.method]=(byMethod[o.method]||0)+o.total; });
    // ยอดต่อพนักงาน
    const byStaff={};
    orders.forEach(o=>{ const n=o.staffName||'-'; byStaff[n]=(byStaff[n]||0)+o.total; });

    $('#reportPanel').innerHTML=`
      <div class="panel-head"><h2>📊 รายงานการขาย</h2>
        <div class="sub-tabs">
          ${[['today','วันนี้'],['week','7 วัน'],['month','เดือนนี้'],['all','ทั้งหมด']].map(([k,t])=>`<button class="sub-tab ${period===k?'active':''}" onclick="REPORT.setPeriod('${k}')">${t}</button>`).join('')}
          <button class="add-fab" onclick="REPORT.exportCSV()">⬇️ Export CSV</button>
          <button class="add-fab" onclick="REPORT.exportAccounting()">⬇️ Export บัญชี</button>
          <button class="add-fab" style="background:var(--gold)" onclick="REPORT.zReport()">🧾 Z-Report</button>
        </div>
      </div>
      ${branchFilterBar()}
      <div class="cards-row">
        <div class="stat-card"><div class="lbl">ยอดขาย</div><div class="val">${STORE.baht(revenue)}</div></div>
        <div class="stat-card"><div class="lbl">จำนวนบิล</div><div class="val">${count} <small>บิล</small></div></div>
        <div class="stat-card"><div class="lbl">เฉลี่ย/บิล</div><div class="val">${STORE.baht(avg)}</div></div>
        <div class="stat-card"><div class="lbl">กำไรขั้นต้น</div><div class="val" style="color:var(--success)">${STORE.baht(profit)}</div><div class="trend">ต้นทุน ${STORE.baht(cost)}</div></div>
        ${fixedMonthly>0?`<div class="stat-card" style="border-left:4px solid ${netProfit>=0?'var(--success)':'var(--danger)'}"><div class="lbl">กำไรสุทธิ (ประมาณ)</div><div class="val" style="color:${netProfit>=0?'var(--success)':'var(--danger)'}">${STORE.baht(netProfit)}</div><div class="trend">หักค่าใช้จ่ายคงที่ ${STORE.baht(fixedShare)} (${days} วัน)</div></div>`:''}
        <div class="stat-card"><div class="lbl">⏱️ เวลาทำเฉลี่ย</div><div class="val">${avgPrep!=null?fmtDur(avgPrep):'-'}<small> นาที</small></div></div>
      </div>
      <div class="row2">
        <div>
          <h3 style="margin-bottom:12px;font-size:16px">🏆 เมนูขายดี</h3>
          <div style="background:var(--surface);padding:16px;border-radius:var(--r-card);box-shadow:var(--shadow)">
            ${top.length?top.map(([n,q])=>`<div class="bar-row"><span class="bn">${esc(n)}</span><div class="bar-track"><div class="bar-fill" style="width:${q/maxQ*100}%"></div></div><span class="bv">${q} แก้ว</span></div>`).join(''):'<div class="empty">ยังไม่มียอดขาย</div>'}
          </div>
        </div>
        <div>
          <h3 style="margin-bottom:12px;font-size:16px">💳 ตามวิธีชำระ</h3>
          <div style="background:var(--surface);padding:16px;border-radius:var(--r-card);box-shadow:var(--shadow);margin-bottom:16px">
            ${Object.entries(byMethod).map(([k,v])=>`<div class="sr" style="margin-bottom:8px"><span>${({cash:'💵 เงินสด',promptpay:'📱 PromptPay',transfer:'🏦 โอน'})[k]||k}</span><b>${STORE.baht(v)}</b></div>`).join('')||'<div class="empty">—</div>'}
          </div>
          <h3 style="margin-bottom:12px;font-size:16px">👥 ยอดตามพนักงาน</h3>
          <div style="background:var(--surface);padding:16px;border-radius:var(--r-card);box-shadow:var(--shadow)">
            ${Object.entries(byStaff).map(([k,v])=>`<div class="sr" style="margin-bottom:8px"><span>${esc(k)}</span><b>${STORE.baht(v)}</b></div>`).join('')||'<div class="empty">—</div>'}
          </div>
        </div>
      </div>
      ${chartSvg()}
      <h3 style="margin:22px 0 12px;font-size:16px">💵 กำไรต่อเมนู (${({today:'วันนี้',week:'7 วัน',month:'เดือนนี้',all:'ทั้งหมด'})[period]})</h3>
      ${profitByMenu(orders)}
      ${branchCompare()}`;
  }
  function branchFilterBar(){
    const branches=STORE.get().branches||[];
    if(!isHQ()||branches.length<2) return `<div style="font-size:13px;color:var(--muted);margin-bottom:10px">📍 กำลังดู: <b>${esc(bfLabel())}</b></div>`;
    const bf=curBF();
    const chip=(id,label)=>`<button class="sub-tab ${bf===id?'active':''}" onclick="REPORT.setBranch('${id}')">${esc(label)}</button>`;
    return `<div style="margin-bottom:12px"><div style="font-size:12px;color:var(--muted);margin-bottom:6px">📍 เลือกสาขาที่ต้องการดู</div><div class="sub-tabs">${chip('all','🏢 ทุกสาขารวม')}${branches.map(b=>chip(b.id,b.name)).join('')}</div></div>`;
  }
  function branchCompare(){
    if(!isHQ()) return '';
    const branches=STORE.get().branches||[];
    if(branches.length<2) return '';
    const all=STORE.get().orders.filter(o=>o.status!=='void'&&o.method!=='unpaid'&&inPeriod(o));
    const rows=branches.map(b=>{
      const os=all.filter(o=>(o.branchId||'BR-001')===b.id);
      const rev=os.reduce((s,o)=>s+o.total,0);
      let cost=0; os.forEach(o=>o.items.forEach(it=>{ const p=STORE.find('products',it.productId); if(p) cost+=p.cost*it.qty; }));
      return {name:b.name,type:b.type,rev,count:os.length,profit:rev-cost};
    }).sort((a,b)=>b.rev-a.rev);
    const maxRev=Math.max(1,...rows.map(r=>r.rev));
    const medal=['🥇','🥈','🥉'];
    return `<h3 style="margin:22px 0 12px;font-size:16px">🏢 เทียบยอดขายแต่ละสาขา (${({today:'วันนี้',week:'7 วัน',month:'เดือนนี้',all:'ทั้งหมด'})[period]})</h3>
      <div style="background:var(--surface);padding:16px;border-radius:var(--r-card);box-shadow:var(--shadow);overflow-x:auto">
      <table style="width:100%"><thead><tr><th>อันดับ</th><th>สาขา</th><th style="text-align:right">ยอดขาย</th><th style="text-align:right">บิล</th><th style="text-align:right">กำไรขั้นต้น</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr><td>${medal[i]||(i+1)}</td><td><b>${esc(r.name)}</b> <small style="color:var(--muted)">${r.type==='franchise'?'แฟรนไชส์':'เจ้าของ'}</small><div class="bar-track" style="margin-top:4px"><div class="bar-fill" style="width:${r.rev/maxRev*100}%"></div></div></td><td style="text-align:right;font-weight:600">${STORE.baht(r.rev)}</td><td style="text-align:right">${r.count}</td><td style="text-align:right;color:var(--success)">${STORE.baht(r.profit)}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  function chartSvg(){
    const all=STORE.get().orders.filter(o=>o.status!=='void'&&o.method!=='unpaid'&&inBranch(o));
    let buckets=[], title='';
    if(period==='all'){
      title='ยอดขายทั้งหมด (รายเดือน)';
      const map={}; all.forEach(o=>{ const d=new Date(o.createdAt); const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); map[k]=(map[k]||0)+o.total; });
      const keys=Object.keys(map).sort();
      buckets=keys.map(k=>({label:k.split('-')[1]+'/'+k.split('-')[0].slice(2), val:map[k]}));
      if(!buckets.length) buckets=[{label:'-',val:0}];
    } else if(period==='month'){
      title='ยอดขายเดือนนี้ (รายวัน)';
      const now=new Date(), dim=now.getDate();
      for(let d=1; d<=dim; d++){ const v=all.filter(o=>{const od=new Date(o.createdAt); return od.getFullYear()===now.getFullYear()&&od.getMonth()===now.getMonth()&&od.getDate()===d;}).reduce((s,o)=>s+o.total,0); buckets.push({label:String(d),val:v}); }
    } else {
      title='ยอดขาย 7 วันล่าสุด';
      const dn=['อา','จ','อ','พ','พฤ','ศ','ส'], now=new Date();
      for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); const v=all.filter(o=>new Date(o.createdAt).toDateString()===d.toDateString()).reduce((s,o)=>s+o.total,0); buckets.push({label:dn[d.getDay()],val:v}); }
    }
    const N=buckets.length, max=Math.max(1,...buckets.map(b=>b.val));
    const W=700,H=150,pad=24,gap=(W-pad*2)/N,bw=Math.max(3,gap*(N>16?0.72:0.5));
    const showVal=N<=10, labelStep=N>16?Math.ceil(N/12):1, fz=N>16?8:11;
    const bars=buckets.map((b,i)=>{ const h=(b.val/max)*(H-50), x=pad+i*gap+(gap-bw)/2, y=H-28-h;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${h||1}" rx="${N>16?2:5}" fill="var(--gold)"/>`+
        ((i%labelStep===0)?`<text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="${fz}" fill="var(--muted)">${esc(b.label)}</text>`:'')+
        ((showVal&&b.val)?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="10" fill="var(--text)">${STORE.baht(b.val).replace('฿','')}</text>`:'');
    }).join('');
    return `<h3 style="margin:22px 0 12px;font-size:16px">📈 ${title}</h3>
      <div style="background:var(--surface);padding:14px;border-radius:var(--r-card);box-shadow:var(--shadow)"><div style="max-width:${N>10?720:560}px;margin:0 auto;overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${N>16?640:0}px;height:auto;display:block">${bars}</svg></div></div>`;
  }
  function profitByMenu(orders){
    const map={};
    orders.forEach(o=>o.items.forEach(it=>{ const p=STORE.find('products',it.productId)||{cost:0}; const rev=(it.base+it.modPrice)*it.qty; const cost=(p.cost||0)*it.qty; if(!map[it.name])map[it.name]={q:0,rev:0,cost:0}; map[it.name].q+=it.qty; map[it.name].rev+=rev; map[it.name].cost+=cost; }));
    const rows=Object.entries(map).sort((a,b)=>(b[1].rev-b[1].cost)-(a[1].rev-a[1].cost));
    if(!rows.length) return '<div class="empty">ยังไม่มียอดขาย</div>';
    return `<table><thead><tr><th>เมนู</th><th>ขาย</th><th>ยอด</th><th>ต้นทุน</th><th>กำไร</th><th>Margin</th></tr></thead><tbody>${rows.map(([nm,d])=>{const pf=d.rev-d.cost;const mg=d.rev?Math.round(pf/d.rev*100):0;return `<tr><td>${esc(nm)}</td><td>${d.q}</td><td>${STORE.baht(d.rev)}</td><td>${STORE.baht(d.cost)}</td><td style="color:var(--success);font-weight:600">${STORE.baht(pf)}</td><td><span class="pill ${mg>=50?'ok':mg>=30?'lo':'no'}">${mg}%</span></td></tr>`;}).join('')}</tbody></table>`;
  }
  function setPeriod(p){ period=p; render(); }
  function setBranch(b){ branchFilter=b; render(); }
  function exportCSV(){
    const orders=sales();
    let csv='เลขที่,วันที่เวลา,ประเภท,พนักงาน,วิธีชำระ,ยอดรวม,ส่วนลด,VAT,สุทธิ\n';
    orders.forEach(o=>{ csv+=`${o.no},${new Date(o.createdAt).toLocaleString('th-TH')},${o.type},${o.staffName},${o.method},${o.subtotal/100},${o.discount/100},${o.vat/100},${o.total/100}\n`; });
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sao_sales_'+period+'_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
    UI.toast('ดาวน์โหลด CSV แล้ว','ok');
  }
  function zReport(){
    const orders=sales();
    const revenue=orders.reduce((s,o)=>s+o.total,0);
    const vat=orders.reduce((s,o)=>s+o.vat,0);
    const disc=orders.reduce((s,o)=>s+o.discount,0);
    const voids=STORE.get().orders.filter(o=>o.status==='void'&&inPeriod(o)&&inBranch(o));
    $('#genModal').className='modal';
    $('#genModal').innerHTML=`
      <div class="modal-h"><h3>🧾 Z-Report (ปิดยอด)</h3><button class="x" onclick="UI.close('genOverlay')">×</button></div>
      <div class="modal-b"><div class="receipt">
        <div class="rc"><h3>${esc(STORE.get().meta.shopName)}</h3>${esc((STORE.curBranch()||{}).name||'')}<br>Z-REPORT<br>${new Date().toLocaleString('th-TH')}</div>
        <div class="rdiv"></div>
        <table><tbody>
          <tr><td>จำนวนบิล</td><td style="text-align:right">${orders.length}</td></tr>
          <tr><td>ยอดขายรวม</td><td style="text-align:right">${STORE.baht(revenue)}</td></tr>
          <tr><td>ส่วนลดรวม</td><td style="text-align:right">${STORE.baht(disc)}</td></tr>
          <tr><td>VAT รวม</td><td style="text-align:right">${STORE.baht(vat)}</td></tr>
          <tr><td>บิลยกเลิก</td><td style="text-align:right">${voids.length}</td></tr>
        </tbody></table>
        <div class="rdiv"></div>
        <div class="rc">ผู้ปิดยอด: ${esc(AUTH.get().name)}</div>
      </div></div>
      <div class="modal-f"><button class="btn-ghost" onclick="UI.close('genOverlay')">ปิด</button><button class="btn-gold" onclick="PAY.print()">🖨️ พิมพ์</button></div>`;
    UI.open('genOverlay');
  }
  function exportAccounting(){
    const orders=sales();
    let csv='วันที่,เลขที่เอกสาร,ลูกค้า,รายละเอียด,มูลค่าก่อนภาษี,ภาษีมูลค่าเพิ่ม,ยอดรวม,วิธีชำระ\n';
    orders.forEach(o=>{ const pre=((o.total-o.vat)/100).toFixed(2), vat=(o.vat/100).toFixed(2), tot=(o.total/100).toFixed(2); const desc=o.items.map(it=>it.qty+'x'+it.name).join(' / ').replace(/[,"]/g,' ');
      csv+=`${new Date(o.createdAt).toLocaleDateString('th-TH')},${o.no}#${o.receiptNo},${(o.staffName||'').replace(/,/g,' ')},"${desc}",${pre},${vat},${tot},${o.method}\n`; });
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sao_accounting_'+period+'_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
    UI.toast('ดาวน์โหลดไฟล์บัญชีแล้ว (เปิดใน Excel/FlowAccount ได้)','ok');
  }
  return {render,setPeriod,setBranch,exportCSV,exportAccounting,zReport};
})();

/* ============================================================
   HISTORY — ประวัติบิล + ยกเลิก/คืนเงิน + พิมพ์ซ้ำ

const HISTORY = (()=>{
  let period='today', q='';
  function inP(o){ const d=new Date(o.createdAt),n=new Date(); if(period==='today')return d.toDateString()===n.toDateString(); if(period==='week')return (n-d)/86400000<=7; return true; }
  function render(){
    let orders=STORE.get().orders.filter(o=>inP(o)&&(o.branchId||'BR-001')===STORE.bid());
    if(q) orders=orders.filter(o=>(o.no||'').toLowerCase().includes(q));
    orders=orders.slice().sort((a,b)=>b.createdAt-a.createdAt);
    $('#historyPanel').innerHTML=`
      <div class="panel-head"><h2>📜 ประวัติบิล</h2>
        <div class="sub-tabs">
          ${[['today','วันนี้'],['week','7 วัน'],['all','ทั้งหมด']].map(([k,t])=>`<button class="sub-tab ${period===k?'active':''}" onclick="HISTORY.setPeriod('${k}')">${t}</button>`).join('')}
        </div></div>
      <div class="field" style="max-width:280px"><input placeholder="ค้นหาเลขบิล เช่น 001" oninput="HISTORY.search(this.value)"></div>
      <table><thead><tr><th>บิล</th><th>เวลา</th><th>ประเภท</th><th>พนักงาน</th><th>ยอด</th><th>เวลาทำ</th><th>สถานะ</th><th></th></tr></thead><tbody>
      ${orders.length?orders.map(o=>`<tr>
        <td><b>${esc(o.no)}</b>${o.table?'<br><small>โต๊ะ '+esc(o.table)+'</small>':''}</td>
        <td>${new Date(o.createdAt).toLocaleString('th-TH')}</td>
        <td>${({'dine-in':'ทานที่ร้าน','takeaway':'กลับบ้าน','delivery':'เดลิเวอรี่'})[o.type]||o.type}</td>
        <td>${esc(o.staffName||'-')}</td>
        <td><b>${STORE.baht(o.total)}</b></td>
        <td>${fmtDur(prepMs(o))}</td>
        <td><span class="pill ${o.status==='void'?'no':o.method==='unpaid'?'lo':'ok'}">${o.status==='void'?'ยกเลิก':o.method==='unpaid'?'ยังไม่จ่าย':'สำเร็จ'}</span></td>
        <td style="text-align:right;white-space:nowrap">
          <button class="sub-tab" onclick="HISTORY.receipt('${o.id}')">🧾 ใบเสร็จ</button>
          ${o.status!=='void'?`<button class="sub-tab" style="color:var(--danger)" onclick="HISTORY.voidIt('${o.id}')">ยกเลิก/คืนเงิน</button>`:''}
        </td></tr>`).join(''):'<tr><td colspan="8"><div class="empty">ไม่มีบิล</div></td></tr>'}
      </tbody></table>`;
  }
  function setPeriod(p){ period=p; render(); }
  function search(v){ q=v.trim().toLowerCase(); render(); }
  function receipt(id){ const o=STORE.find('orders',id); if(o) PAY.receipt(o); }
  function voidIt(id){ voidOrder(id); }
  return {render,setPeriod,search,receipt,voidIt};
})();

/* ============================================================

  function render(){
    const allowed=TABS.filter(t=>t[2]==='*'?AUTH.get().role==='owner':AUTH.can(t[2]));

    else if(tab==='member') renderMember();
    else if(tab==='promo') renderPromo();
    else if(tab==='staff') renderStaff();
  }

        <td><span class="pill ${p.available?'ok':'no'}">${p.available?'ขายอยู่':'ปิด'}</span></td>
        <td style="text-align:right;white-space:nowrap">

  function uploadImg(id){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=()=>{
      const file=inp.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=(e)=>{
        const img=new Image();
        img.onload=()=>{
          // ย่อรูปกว้างสุด 640px + บีบอัด JPEG 0.8 เพื่อไม่ให้ localStorage เต็ม
          const max=640; let w=img.width,h=img.height;
          if(w>max){ h=Math.round(h*max/w); w=max; }
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          let data; try{ data=cv.toDataURL('image/jpeg',0.8); }catch(err){ UI.toast('อ่านรูปไม่ได้','err'); return; }
          const p=STORE.find('products',id);
          if(p){ p.img=data; p.updatedAt=STORE.now(); STORE.save(); render(); UI.toast('อัปโหลดรูปแล้ว','ok'); }
        };
        img.onerror=()=>UI.toast('ไฟล์รูปไม่ถูกต้อง','err');
        img.src=e.target.result;
      };
      reader.readAsDataURL(file);
    };
    inp.click();
  }

  function dedupeMenu(quiet){
    const D=STORE.get(); let nCat=0,nProd=0,nIng=0,nTab=0,nPromo=0,nSup=0,nStaff=0;
    const bids=[...new Set((D.branches||[]).map(b=>b.id))]; if(!bids.length) bids.push('BR-001');
    const alive=x=>!x.deletedAt;
    const touched=new Map();                       // รวมรายการที่แก้ -> ส่งขึ้น cloud ทีเดียว
    const touch=(tbl,obj)=>{ touched.set(tbl+':'+obj.id,[tbl,obj]); };
    bids.forEach(bid=>{
      const inB=x=>(x.branchId||'BR-001')===bid;
      // --- หมวดหมู่: เก็บตัวที่มีเมนูชี้มากสุด, ย้ายเมนูจากตัวซ้ำมาชี้ตัวหลัก ---
      const cats=(D.categories||[]).filter(c=>inB(c)&&alive(c));
      const cg={}; cats.forEach(c=>{ const k=(c.name||'').trim(); (cg[k]=cg[k]||[]).push(c); });
      Object.values(cg).forEach(g=>{ if(g.length<2) return;
        g.sort((a,b)=>(D.products||[]).filter(p=>p.cat===b.id&&alive(p)).length-(D.products||[]).filter(p=>p.cat===a.id&&alive(p)).length);
        const keep=g[0]; touch('categories',keep);
        g.slice(1).forEach(c=>{ (D.products||[]).forEach(p=>{ if(p.cat===c.id){ p.cat=keep.id; touch('products',p); } }); c.deletedAt=STORE.now(); touch('categories',c); nCat++; });
      });
      // --- เมนู: เก็บตัวที่มีสูตร/รูป (สมบูรณ์สุด) ---
      const ps=(D.products||[]).filter(p=>inB(p)&&alive(p));
      const pg={}; ps.forEach(p=>{ const k=(p.name||'').trim(); (pg[k]=pg[k]||[]).push(p); });
      Object.values(pg).forEach(g=>{ if(g.length<2) return;
        g.sort((a,b)=>((((b.recipe||[]).length?2:0)+(b.img?1:0))-(((a.recipe||[]).length?2:0)+(a.img?1:0))) || ((a.createdAt||0)-(b.createdAt||0)));
        touch('products',g[0]);   // push ตัวที่เก็บขึ้น cloud ด้วย (กัน cloud เหลือแต่ตัวถูกลบ)
        g.slice(1).forEach(p=>{ p.deletedAt=STORE.now(); touch('products',p); nProd++; });
      });
      // --- วัตถุดิบ: เก็บตัวแรก + ชี้สูตรกลับมาตัวหลัก ---
      const igs=(D.ingredients||[]).filter(i=>inB(i)&&alive(i));
      const ig={}; igs.forEach(i=>{ const k=(i.name||'').trim(); (ig[k]=ig[k]||[]).push(i); });
      Object.values(ig).forEach(g=>{ if(g.length<2) return;
        g.sort((a,b)=>((b.stock||0)-(a.stock||0)) || ((a.createdAt||0)-(b.createdAt||0))); const keep=g[0]; touch('ingredients',keep);
        g.slice(1).forEach(i=>{ (D.products||[]).forEach(p=>{ let ch=false; (p.recipe||[]).forEach(r=>{ if(r.ingredientId===i.id){ r.ingredientId=keep.id; ch=true; } }); if(ch) touch('products',p); }); i.deletedAt=STORE.now(); touch('ingredients',i); nIng++; });
      });
      // --- โต๊ะ / โปร / ซัพพลายเออร์: เก็บตัวแรก ---
      const dedupe=(arr,tbl,keyFn,onDup)=>{ const grp={}; (arr||[]).filter(x=>inB(x)&&alive(x)).forEach(x=>{ const k=keyFn(x); (grp[k]=grp[k]||[]).push(x); });
        Object.values(grp).forEach(g2=>{ if(g2.length<2) return; g2.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); const kp=g2[0]; touch(tbl,kp);
          g2.slice(1).forEach(x=>{ x.deletedAt=STORE.now(); touch(tbl,x); onDup&&onDup(x,kp); }); }); };
      dedupe(D.tables,'tables_',t=>(t.name||'').trim(),()=>{nTab++;});
      dedupe(D.promos,'promos',p=>(p.code||'').trim(),()=>{nPromo++;});
      dedupe(D.suppliers,'suppliers',sp=>(sp.name||'').trim(),(dup,keep)=>{ (D.ingredients||[]).forEach(i=>{ if(i.supplierId===dup.id){ i.supplierId=keep.id; touch('ingredients',i); } }); nSup++; });
      // --- พนักงาน: เก็บตัวที่ใช้อยู่ (ตัวเอง > HQ > ทำงานอยู่ > มียอดขาย) · ห้ามลบตัวเอง/HQ ตัวจริง ---
      const sg={}; (D.staff||[]).filter(x=>inB(x)&&alive(x)).forEach(x=>{ const k=(x.name||'').trim()+'|'+(x.role||''); (sg[k]=sg[k]||[]).push(x); });
      Object.values(sg).forEach(g=>{ if(g.length<2) return;
        const me=(AUTH.get()||{}).id;
        const score=x=>(x.id===me?8:0)+(x.hq?4:0)+(x.active?2:0)+(((x.sales||0)>0)?1:0);
        g.sort((a,b)=>(score(b)-score(a)) || ((a.createdAt||0)-(b.createdAt||0)));
        const keepSt=g[0]; touch('staff',keepSt);
        g.slice(1).forEach(x=>{ if(x.hq) keepSt.hq=true; keepSt.sales=(keepSt.sales||0)+(x.sales||0); x.deletedAt=STORE.now(); x.active=false; touch('staff',x); touch('staff',keepSt); nStaff++; });
      });
    });
    const total=nCat+nProd+nIng+nTab+nPromo+nSup+nStaff;
    if(!total){ if(!quiet) UI.toast('ไม่พบข้อมูลซ้ำ','ok'); return; }
    STORE.save();
    // ส่งทุกรายการที่แก้ขึ้น cloud ทันที (กันโดน sync ดึงตัวเก่ากลับมา)
    touched.forEach(([tbl,obj])=>{ CLOUD.pushItem(tbl,obj); });
    if(quiet){ console.log('auto-dedupe:',total,'รายการ'); try{ if(typeof NAV!=='undefined'&&NAV.cur){ const v=NAV.cur(); if(v==='bo')render(); else if(v==='pos'&&POS.render)POS.render(); } if(AUTH.renderLock&&document.querySelector('#lockScreen')&&!document.querySelector('#lockScreen').classList.contains('hide')) AUTH.renderLock(); }catch(e){} return; }
    render();
    UI.confirm2('ล้างข้อมูลซ้ำแล้ว ✅',`หมวด ${nCat} · เมนู ${nProd} · วัตถุดิบ ${nIng} · โต๊ะ ${nTab} · โปร ${nPromo} · ซัพพลายเออร์ ${nSup} · พนักงาน ${nStaff}\n\nส่งผลการลบขึ้น cloud แล้ว ${touched.size} รายการ (กันซ้ำเด้งกลับ)`,()=>{});
  }

  let recProd=null, recDraft=[];

  async function callGemini(key,b64){
    const prompt='อ่านบิล/ใบเสร็จ/ใบส่งของในรูปนี้ ดึงเฉพาะรายการสินค้า/วัตถุดิบออกมา ตอบเป็น JSON array ของ object {"name":"ชื่อสินค้า","qty":จำนวนเป็นตัวเลข,"unit":"หน่วยเช่นกรัม/ขวด/ใบ","price":ราคารวมของบรรทัดเป็นตัวเลขบาท} ห้ามใส่ ยอดรวม ภาษี ส่วนลด ค่าจัดส่ง ตอบเป็น JSON อย่างเดียวไม่มีข้อความอื่น';
    const body={contents:[{parts:[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],generationConfig:{responseMimeType:'application/json',temperature:0}};
    const models=['gemini-2.0-flash','gemini-flash-latest','gemini-2.5-flash','gemini-2.0-flash-lite'];
    let lastErr='';
    // ลองหลายโมเดล + ลองซ้ำเมื่อเจอ 503/429 (โมเดลคนเยอะ)
    for(const model of models){
      for(let attempt=0; attempt<3; attempt++){
        try{
          const url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(key);
          const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
          if(res.status===503||res.status===429){ lastErr='โมเดลคนเยอะ ('+res.status+')'; UI.toast('โมเดลคนเยอะ ลองใหม่...','ok'); await new Promise(r=>setTimeout(r,1200*(attempt+1))); continue; }
          if(!res.ok){ const t=await res.text(); lastErr='HTTP '+res.status+' '+t.slice(0,120); break; } // error อื่น -> เปลี่ยนโมเดล
          const j=await res.json();
          let txt=(((j.candidates||[])[0]||{}).content||{}).parts; txt=txt&&txt[0]?txt[0].text:'[]';
          let arr; try{ arr=JSON.parse(txt); }catch(e){ arr=JSON.parse((txt||'').replace(/```json|```/g,'').trim()||'[]'); }
          if(!Array.isArray(arr)) arr=arr.items||arr.products||[];
          return arr.filter(x=>x&&x.name);
        }catch(e){ lastErr=e.message||String(e); await new Promise(r=>setTimeout(r,800)); }
      }
    }
    throw new Error(lastErr||'ลองหลายครั้งแล้วไม่สำเร็จ');
  }

/* ============================================================

const SHIFT = (()=>{
  let cur=null;

  function recordSale(order){

  }
  function render(){
    const sh=active();
    if(!sh){
      $('#shiftPanel').innerHTML=`
        <div class="panel-head"><h2>💰 กะ / ลิ้นชักเงินสด</h2></div>

          ${AUTH.can('cashcount')?'<div style="margin-top:14px"><button class="btn-ghost" onclick="SHIFT.cashCountPIN()">🔍 ตรวจนับเงิน (ไม่ต้องเปิดกะ)</button></div>':''}
        </div>`;
      return;
    }
    const log=STORE.get().cashlog.filter(c=>c.shiftId===sh.id);
    const cashSales=log.filter(c=>c.type==='sale').reduce((s,c)=>s+c.amount,0);
    const cashIn=log.filter(c=>c.type==='in').reduce((s,c)=>s+c.amount,0);

    $('#shiftPanel').innerHTML=`
      <div class="panel-head"><h2>💰 กะปัจจุบัน</h2>

        <div class="stat-card"><div class="lbl">เงินเข้า/ออก</div><div class="val">+${STORE.baht(cashIn)}<small> / -${STORE.baht(cashOut)}</small></div></div>
        <div class="stat-card"><div class="lbl">ควรมีในลิ้นชัก</div><div class="val" style="color:var(--gold)">${STORE.baht(expected)}</div></div>
      </div>
      <h3 style="margin-bottom:12px;font-size:16px">รายการเคลื่อนไหว</h3>
      <table><thead><tr><th>เวลา</th><th>ประเภท</th><th>หมายเหตุ</th><th style="text-align:right">จำนวน</th></tr></thead><tbody>
        ${log.slice().reverse().map(c=>`<tr><td>${new Date(c.at).toLocaleTimeString('th-TH')}</td><td>${({sale:'ขาย',in:'เงินเข้า',out:'เงินออก'})[c.type]}</td><td>${esc(c.note||'-')}</td><td style="text-align:right;color:${c.type==='out'?'var(--danger)':'var(--success)'}">${c.type==='out'?'-':'+'}${STORE.baht(c.amount)}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">ยังไม่มีรายการ</div></td></tr>'}
      </tbody></table>`;

  function openShift(){

    UI.ask('ปิดกะ — นับเงินจริง',[{key:'count',label:`เงินที่นับได้จริง (ควรมี ${STORE.baht(expected)})`,type:'number',value:''}],(o)=>{
      const counted=STORE.toSatang(o.count); const diff=counted-expected;
      sh.closeCash=counted; sh.closedAt=STORE.now(); sh.expected=expected; sh.diff=diff; STORE.save(); CLOUD.pushItem('shifts',sh);
      UI.confirm2('ปิดกะสำเร็จ',`ควรมี ${STORE.baht(expected)}\nนับได้ ${STORE.baht(counted)}\nส่วนต่าง ${diff===0?'พอดี ✓':(diff>0?'เกิน ':'ขาด ')+STORE.baht(Math.abs(diff))}`,()=>{ render(); });
      LINEN.send('🔒 ปิดกะ\n'+LINEN.SEP+'\n💼 ควรมี: '+STORE.baht(expected)+'\n🧮 นับได้: '+STORE.baht(counted)+'\n'+(diff===0?'✅ ตรงพอดี':(diff>0?'➕ เกิน ':'⚠️ ขาด ')+STORE.baht(Math.abs(diff)))+'\n👤 พนักงาน: '+((AUTH.get()||{}).name||'-')+'\n🕐 '+LINEN.thDT(Date.now()),'shift');

  }
  let _ccExpected=0, _ccBy=null;
  // ขั้นที่ 1: ใส่ PIN ผู้ตรวจ — ต้องเป็นตำแหน่งที่เจ้าของอนุญาตให้ตรวจเงิน
  function cashCountPIN(){
    UI.ask('🔍 ตรวจนับเงิน — ยืนยันผู้ตรวจ',[{key:'pin',label:'ใส่ PIN ผู้ตรวจ',type:'password',value:''}],(o)=>{

      if(!st){ UI.toast('PIN ไม่ถูกต้อง','err'); return; }

  function cashCount(){

  function save(){
    const m=STORE.get().meta, s=STORE.get().settings;
    m.shopName=$('#setShop').value; { const bs=$('#setBrandSub'); if(bs) m.brandSub=bs.value.trim(); } m.orderBaseUrl=$('#setOrderUrl').value.trim(); s.geminiKey=$('#setGemini').value.trim(); { const o=$('#setOpenai'); if(o)s.openaiKey=o.value.trim(); const c=$('#setClaude'); if(c)s.claudeKey=c.value.trim(); const pv=$('#setAiProvider'); if(pv)s.aiProvider=pv.value; const am=$('#setAiModel'); if(am)s.aiModel=am.value.trim(); } try{ APP.applyBrand(); }catch(e){}
    const cb=STORE.curBranch(); if(cb){ cb.name=$('#setBranch').value; cb.promptpayId=$('#setPP').value.trim(); cb.taxId=$('#setTaxId').value.trim(); cb.address=$('#setAddr').value.trim(); const tc=$('#setTgChat'); if(tc) cb.tgChat=tc.value.trim(); CLOUD.pushItem('branches',cb); } { const to_=$('#setTgOn'); if(to_) s.tgNotify=to_.value==='1'; const tt=$('#setTgToken'); if(tt) s.tgToken=tt.value.trim(); const ck=id=>{const e=$('#'+id);return e?!!e.checked:true;}; if($('#tgEvShift')) s.tgEvents={sale:ck('tgEvSale'),shift:ck('tgEvShift'),count:ck('tgEvCount'),cashout:ck('tgEvCashout'),qr:ck('tgEvQr'),slow:ck('tgEvSlow'),open:ck('tgEvOpen'),voided:ck('tgEvVoid'),payqr:ck('tgEvPayQr'),paytransfer:ck('tgEvPayTr'),lowstock:ck('tgEvLow')}; const sm=$('#tgSlowMin'); if(sm) s.tgSlowMin=Math.max(1,parseInt(sm.value)||10); } BRANCH.renderChip();
    m.vatRate=parseFloat($('#setVat').value)||0; m.serviceCharge=parseFloat($('#setSvc').value)||0;
    m.vatIncluded=$('#setVatInc').value==='1';
    s.receiptFooter=$('#setFoot').value; s.theme=$('#setTheme').value; s.qrPayPolicy=$('#setQrPolicy').value;
    const cust=($('#setSessionCustom').value||'').trim();
    s.sessionTimeoutMin = cust!=='' ? Math.max(0,parseInt(cust)||0) : (parseInt($('#setSession').value)||0);
    s.ptEarnPerBaht=Math.max(0,parseInt($('#setPtPer').value)||0); s.ptValueBaht=Math.max(0,parseFloat($('#setPtVal').value)||0);
    s.paperWidth=$('#setPaper').value; s.autoPrint=$('#setAutoPrint').value==='1'; s.printMethod=$('#setPrintMethod').value; s.kdsServeSlip=$('#setServeSlip').value==='1'; { const dr=$('#setDrawer'); if(dr) s.autoDrawer=dr.value==='1'; const sq=$('#setSndQR'); if(sq) s.sndQR=sq.value==='1'; const rq=$('#setReqShift'); if(rq) s.requireShift=rq.value==='1'; }
    STORE.save(); applyTheme(); UI.toast('บันทึกการตั้งค่าแล้ว','ok');

  function uploadQr(){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=()=>{ const file=inp.files[0]; if(!file) return; const reader=new FileReader();
      reader.onload=(e)=>{ const img=new Image(); img.onload=()=>{ const max=480; let w=img.width,h=img.height; const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc); const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); STORE.get().settings.promptpayQrImg=cv.toDataURL('image/png'); STORE.save(); render(); UI.toast('อัปโหลด QR แล้ว','ok'); }; img.onerror=()=>UI.toast('ไฟล์รูปไม่ถูกต้อง','err'); img.src=e.target.result; };
      reader.readAsDataURL(file); };
    inp.click();
  }
  function removeQr(){ delete STORE.get().settings.promptpayQrImg; STORE.save(); render(); UI.toast('ลบรูป QR แล้ว ใช้ QR อัตโนมัติ','ok'); }

      reader.onload=(e)=>{ const img=new Image(); img.onload=()=>{ const max=320; let w=img.width,h=img.height; const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc); const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); STORE.get().meta.logo=cv.toDataURL('image/png'); STORE.save(); render(); UI.toast('อัปโหลดโลโก้แล้ว','ok'); }; img.onerror=()=>UI.toast('ไฟล์รูปไม่ถูกต้อง','err'); img.src=e.target.result; };
      reader.readAsDataURL(file); };
    inp.click();

  function shade(hex,pct){ try{ hex=hex.replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join(''); let r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16); const f=x=>Math.max(0,Math.min(255,Math.round(x+(pct/100)*255))); return '#'+[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ return hex; } }

  function applyBrandColor(){
    const c=(STORE.curBranch()||{}).brandColors, root=document.documentElement.style;
    const keys=['--green','--green-dark','--gold','--gold-light','--cream','--surface-2'];
    if(c&&c.primary){
      root.setProperty('--green',c.primary);
      root.setProperty('--green-dark',c.dark||shade(c.primary,-12));
      root.setProperty('--gold',c.accent||'#A67C3D');
      root.setProperty('--gold-light',c.light||shade(c.accent||'#A67C3D',14));
      if(c.bg){ root.setProperty('--cream',c.bg); root.setProperty('--surface-2',shade(c.bg,3)); }
      else { root.removeProperty('--cream'); root.removeProperty('--surface-2'); }
    } else { keys.forEach(k=>root.removeProperty(k)); }
  }

  function backup(){
    const blob=new Blob([JSON.stringify(STORE.get(),null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='saocafe_backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
    UI.toast('สำรองข้อมูลแล้ว','ok');
  }
  function restore(input){
    const file=input.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=(e)=>{ try{ const data=JSON.parse(e.target.result); localStorage.setItem('saocafe_v2',JSON.stringify(data)); UI.toast('กู้คืนสำเร็จ','ok'); setTimeout(()=>location.reload(),800); }catch(err){ UI.toast('ไฟล์ไม่ถูกต้อง','err'); } };
    r.readAsText(file);
  }
  function confirmReset(){
    if(AUTH.get().role!=='owner'){ UI.toast('เฉพาะเจ้าของร้านเท่านั้น','err'); return; }
    UI.ask('⚠️ ล้างข้อมูลทั้งหมด (กู้คืนไม่ได้)',[{key:'c',label:'พิมพ์คำว่า  ลบทั้งหมด  เพื่อยืนยัน'}],(o)=>{
      if((o.c||'').trim()==='ลบทั้งหมด') STORE.hardReset();
      else UI.toast('ยกเลิก — คำยืนยันไม่ถูกต้อง','err');
    });
  }
  return {render,save,backup,restore,applyTheme,applyBrandColor,colorPresets,pickColor,applyCustomColor,resetColor,uploadQr,removeQr,confirmReset,testPrint,toggleKey,pickLogo,clearLogo,cloudSignIn,cloudSignOut};
})();

/* ============================================================
   VOID — ยกเลิกบิล (ต้องมีสิทธิ์/อนุมัติ)
   ============================================================ */
function voidOrder(oid){
  AUTH.requireApproval('การยกเลิกบิลต้องได้รับอนุมัติ',()=>{
    UI.ask('ยกเลิกบิล',[{key:'reason',label:'เหตุผลการยกเลิก',value:''}],(o)=>{
      const ord=STORE.find('orders',oid); if(!ord||ord.status==='void') return;
      // คืนสต็อกวัตถุดิบกลับเมื่อยกเลิก/คืนเงิน
      (ord.items||[]).forEach(it=>{ const p=STORE.find('products',it.productId); if(p&&p.recipe) p.recipe.forEach(r=>{ const ig=STORE.find('ingredients',r.ingredientId); if(ig) ig.stock+=r.qty*it.qty; }); });
      ord.status='void'; ord.voidReason=o.reason||'-'; ord.closedAt=STORE.now(); STORE.save();
      LINEN.send(LINEN.voidMsg(ord,o.reason),'voided');
      CLOUD.pushOrder(ord); KDS.updateBadge(); if(NAV.cur()==='history') HISTORY.render(); UI.toast('ยกเลิก/คืนเงินแล้ว','ok');
    });
  });
}
