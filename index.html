/* ============================================================
   SPLIT — แยกบิล / จ่ายแยกตามรายการ
   ============================================================ */
const SPLIT = (()=>{
  function open(){ if(!POS.getCart().length){ UI.toast('ยังไม่มีรายการ','err'); return; } if(STORE.get().settings.requireShift && !SHIFT.active()){ UI.toast('⚠️ ต้องเปิดกะก่อนเริ่มขาย','err'); NAV.go('shift'); return; } render('cash'); }
  function render(method){
    const cart=POS.getCart();
    $('#genModal').className='modal wide';
    $('#genModal').innerHTML=`<div class="modal-h"><h3>✂️ แยกบิล / จ่ายแยก</h3><button class="x" onclick="UI.close('genOverlay')">×</button></div>
      <div class="modal-b">
        <p style="font-size:13px;color:var(--muted);margin-bottom:10px">ใส่จำนวนแต่ละเมนูที่จะ "จ่ายบิลนี้" · ส่วนที่เหลือยังอยู่ในตะกร้า</p>
        ${cart.map((c,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)">
          <div style="flex:1"><b>${esc(c.name)}</b> <span style="color:var(--muted)">(มี ${c.qty})</span><br><span style="color:var(--gold)">${STORE.baht(c.base+c.modPrice)}/ชิ้น</span></div>
          <input type="number" id="sp_${i}" min="0" max="${c.qty}" value="0" style="width:72px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);text-align:center" oninput="SPLIT.calc()">
        </div>`).join('')}
        <div class="sr tot" style="margin-top:12px"><span>ยอดบิลนี้</span><span id="spTotal">฿0</span></div>
        <div style="margin-top:10px"><div style="font-size:13px;font-weight:600;margin-bottom:6px">วิธีชำระบิลนี้</div>
          <div class="opt-chips">
            <button class="opt-chip ${method==='cash'?'sel':''}" onclick="SPLIT.render('cash')">💵 เงินสด</button>
            <button class="opt-chip ${method==='promptpay'?'sel':''}" onclick="SPLIT.render('promptpay')">📱 PromptPay</button>
          </div>
          ${method==='promptpay'?`<div style="text-align:center;margin-top:10px"><div class="qr-box" id="spQR"></div></div>`:''}
        </div>
      </div>
      <div class="modal-f"><button class="btn-ghost" onclick="UI.close('genOverlay')">ปิด</button><button class="btn-gold" onclick="SPLIT.pay('${method}')">✓ รับเงินบิลนี้</button></div>`;
    UI.open('genOverlay'); calc();
  }
  function readSel(){ const cart=POS.getCart(), sel=[]; cart.forEach((c,i)=>{ const el=$('#sp_'+i); const q=el?Math.min(c.qty,Math.max(0,parseInt(el.value)||0)):0; if(q>0) sel.push({line:c,qty:q}); }); return sel; }
  function calc(){ const sel=readSel(); const tot=sel.reduce((s,x)=>s+(x.line.base+x.line.modPrice)*x.qty,0); const el=$('#spTotal'); if(el) el.textContent=STORE.baht(tot); const qr=$('#spQR'); if(qr) qr.innerHTML=PAY.promptpayQR(tot); return tot; }
  async function pay(method){
    const sel=readSel(); if(!sel.length){ UI.toast('เลือกจำนวนที่จะจ่ายก่อน','err'); return; }
    const _rno=await CLOUD.nextNo('receipt');
    const tot=sel.reduce((s,x)=>s+(x.line.base+x.line.modPrice)*x.qty,0); const st=AUTH.get();
    const order={ id:STORE.uuid(), no:(POS.getState().orderNo||'#?')+'/แยก', receiptNo:_rno, branchId:STORE.bid(),
      type:POS.getType(), table:POS.getTable()||'',
      items:sel.map(x=>({line:STORE.uuid(),productId:x.line.productId,name:x.line.name,base:x.line.base,modPrice:x.line.modPrice,mods:x.line.mods,qty:x.qty,note:''})),
      subtotal:tot,discount:0,vat:0,service:0,total:tot,method,paid:tot,change:0,
      status:'preparing',payStatus:'paid',memberId:null,staffId:st?st.id:null,staffName:st?st.name:'',channel:'pos',createdAt:STORE.now(),closedAt:null };
    STORE.get().orders.push(order);
    INV.deduct(order); SHIFT.recordSale(order); CLOUD.pushOrder(order); STORE.save();
    const cart=POS.getCart(); sel.forEach(x=>{ x.line.qty-=x.qty; });
    for(let i=cart.length-1;i>=0;i--){ if(cart[i].qty<=0) cart.splice(i,1); }
    KDS.updateBadge(); PAY.receipt(order);
    if(!cart.length) POS.clearAfterPay(); else POS.renderCart();
    UI.toast('รับเงินบิลแยกแล้ว '+STORE.baht(tot),'ok');
  }
  return {open,render,calc,pay};
})();

/* ============================================================
   LINEN — แจ้งเตือน LINE เจ้าของสาขา (ผ่าน Supabase Edge Function)
   ============================================================ */
const LINEN = (()=>{   // แจ้งเตือน Telegram (บอทเดียว ใช้ทุกสาขา · Chat ID แยกต่อสาขา)
  const SEP='━━━━━━━━━━━━━━';
  const thDT=ts=>{ const d=new Date(ts||Date.now()); return d.getDate()+'/'+(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2); };
  const hhmm=ts=>{ const d=new Date(ts); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); };
  const payName=m=>m==='cash'?'เงินสด':m==='promptpay'?'สแกน PromptPay':m==='transfer'?'โอนเงิน':(m||'-');
  function saleMsg(o){
    const n=(o.items||[]).reduce((a,b)=>a+(b.qty||1),0);
    return '🛒 ขายได้!\n'+SEP
      +'\n🧾 บิล: '+(o.no||'-')
      +'\n📦 จำนวน: '+n+' รายการ'
      +'\n💰 ยอด: '+STORE.baht(o.total)
      +'\n💳 ชำระ: '+payName(o.method)
      +'\n👤 พนักงาน: '+(o.staffName||(AUTH.get()||{}).name||'-')
      +'\n🕐 '+thDT(o.closedAt||o.createdAt);
  }
  function voidMsg(o,reason){
    return '⚠️ ยกเลิกบิล!\n'+SEP
      +'\n🧾 บิล: '+(o.no||'-')
      +'\n💸 ยอดที่ยกเลิก: '+STORE.baht(o.total)
      +'\n📝 เหตุผล: '+(reason||o.voidReason||'-')
      +'\n👤 พนักงาน: '+((AUTH.get()||{}).name||'-')
      +'\n🕐 '+thDT(Date.now());
  }
  function qrMsg(o){
    return '🛎️ ลูกค้าสแกนสั่ง!\n'+SEP
      +'\n🪑 โต๊ะ: '+(o.table||'กลับบ้าน')
      +'\n'+(o.items||[]).map(i=>'• '+i.qty+'× '+i.name).join('\n').slice(0,400)
      +'\n💰 รวม: '+STORE.baht(o.total)
      +'\n🕐 '+thDT(o.createdAt);
  }
  function daySummary(){
    const td=new Date().toDateString();
    const all=STORE.get().orders.filter(x=>(x.branchId||'BR-001')===STORE.bid()&&new Date(x.createdAt).toDateString()===td);
    const ok=all.filter(x=>x.status!=='void'&&x.payStatus!=='open'&&x.method&&x.method!=='unpaid');
    const voided=all.filter(x=>x.status==='void');
    const tot=ok.reduce((a,b)=>a+b.total,0);
    const cash=ok.filter(x=>x.method==='cash'), qrtr=ok.filter(x=>x.method==='promptpay'||x.method==='transfer');
    const times=ok.map(x=>x.createdAt).sort((a,b)=>a-b);
    const cnt={}; ok.forEach(x=>(x.items||[]).forEach(it=>{ cnt[it.name]=(cnt[it.name]||0)+(it.qty||1); }));
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3);
    return '📊 สรุปยอดขายประจำวัน\n'+SEP
      +'\n📅 '+thDT(Date.now()).split(' ')[0]
      +(times.length?'\n⏰ เวลาขาย: '+hhmm(times[0])+' → '+hhmm(times[times.length-1]):'')
      +'\n\n💰 ยอดขายรวม: '+STORE.baht(tot)
      +'\n📦 จำนวนบิล: '+ok.length+' บิล'
      +(ok.length?'\n📈 เฉลี่ย: '+STORE.baht(Math.round(tot/ok.length))+'/บิล':'')
      +'\n\n💵 เงินสด: '+STORE.baht(cash.reduce((a,b)=>a+b.total,0))+' ('+cash.length+' บิล)'
      +'\n📱 QR/โอน: '+STORE.baht(qrtr.reduce((a,b)=>a+b.total,0))+' ('+qrtr.length+' บิล)'
      +'\n❌ ยกเลิก: '+voided.length+' บิล'
      +'\n\n🏆 เมนูขายดีวันนี้:'+(top.length?top.map((t,i)=>'\n'+(i+1)+'. '+t[0]+' ×'+t[1]).join(''):'\n- ไม่มีข้อมูล');
  }
  function token(){ return ((STORE.get().settings||{}).tgToken||'').trim(); }
  function chat(){ const b=STORE.curBranch()||{}; return (b.tgChat||'').trim(); }
  async function send(text,ev){
    try{
      const st=STORE.get().settings; if(!st.tgNotify) return false;
      if(ev && st.tgEvents && st.tgEvents[ev]===false) return false;   // เหตุการณ์นี้ถูกปิดไว้
      const tk=token(), ch=chat(); if(!tk||!ch) return false;
      const bn=(STORE.curBranch()||{}).name||'';
      const r=await fetch('https://api.telegram.org/bot'+tk+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:ch,text:'['+bn+'] '+text})});
      return r.ok;
    }catch(e){ console.error('tg notify',e); return false; }
  }
  async function test(){
    const st=STORE.get().settings;
    if(!st.tgNotify){ UI.toast('เปิดสวิตช์แจ้งเตือนก่อน แล้วกดบันทึก','err'); return; }
    if(!token()){ UI.toast('ใส่ Bot Token ก่อน (จาก @BotFather)','err'); return; }
    if(!chat()){ UI.toast('ใส่ Chat ID ของสาขานี้ก่อน','err'); return; }
    UI.toast('กำลังส่งทดสอบ...','ok');
    const ok=await send('🔔 ทดสอบแจ้งเตือนจากระบบ POS ✅');
    UI.toast(ok?'ส่งแล้ว! เช็คใน Telegram':'ส่งไม่สำเร็จ — เช็ค Token/Chat ID (ผู้รับต้องกด Start บอทก่อน)', ok?'ok':'err');
  }
  // สแกนออเดอร์ค้างครัวเกินเวลาที่ตั้ง -> แจ้งครั้งเดียวต่อออเดอร์
  function slowScan(){
    const st=STORE.get().settings; if(!st.tgNotify) return;
    if(st.tgEvents && st.tgEvents.slow===false) return;
    const mins=Math.max(1,parseInt(st.tgSlowMin)||10), lim=mins*60000;
    STORE.get().orders.filter(o=>o.status==='preparing'&&(o.branchId||'BR-001')===STORE.bid()&&!o.slowNotified&&(STORE.now()-o.createdAt)>lim)
      .forEach(o=>{ o.slowNotified=true; STORE.save(); CLOUD.pushOrder(o);
        send('⏰ ออเดอร์ '+o.no+(o.table?' โต๊ะ '+o.table:'')+' ค้างครัวเกิน '+mins+' นาที · '+o.items.map(i=>i.qty+'×'+i.name).join(', ').slice(0,200),'slow'); });
  }
  return {send,test,slowScan,saleMsg,voidMsg,qrMsg,daySummary,thDT,SEP};
})();

/* ============================================================
   BRANCH — หลายสาขา: สลับสาขาปัจจุบัน / เพิ่ม-แก้สาขา (เฟส 1a)
   ============================================================ */
const BRANCH = (()=>{
  function list(){ return STORE.get().branches||[]; }
  function cur(){ return STORE.curBranch(); }
  function renderChip(){ try{ SETTINGS.applyBrandColor(); }catch(e){} const b=cur(); const el=$('#branchName'); if(el) el.textContent=b?b.name:'—'; const chip=$('#branchChip'); if(chip){ const hq=AUTH.isHQ&&AUTH.isHQ(); chip.style.cursor=hq?'pointer':'default'; chip.style.opacity=hq?'1':'0.85'; chip.title=hq?'สลับสาขา':'สาขาของคุณ (สลับได้เฉพาะ HQ)'; } }
  function typeTh(t){ return t==='franchise'?'แฟรนไชส์':'เจ้าของเอง'; }
  function switcher(){
    if(!AUTH.isHQ()){ UI.toast('สลับสาขาได้เฉพาะผู้ดูแลระบบ (HQ) — ตั้งได้ที่ พนักงาน → ดูได้ทุกสาขา','err'); return; }
    const curId=STORE.bid(), isOwner=AUTH.isHQ();
    $('#genModal').className='modal';
    $('#genModal').innerHTML=`
      <div class="modal-h"><h3>🏢 เลือกสาขา</h3><button class="x" onclick="UI.close('genOverlay')">×</button></div>
      <div class="modal-b">
        <p style="font-size:13px;color:var(--muted);margin-bottom:10px">เครื่องนี้กำลังขายในนามสาขาที่เลือก · ออเดอร์/กะ/สต็อกจะบันทึกเข้าสาขานี้</p>
        ${list().filter(b=>b.active!==false).map(b=>`<button class="lock-staff-btn" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border:1.5px solid ${b.id===curId?'var(--gold)':'var(--line)'};background:${b.id===curId?'rgba(192,138,62,.08)':'var(--surface)'};border-radius:12px;margin-bottom:8px;cursor:pointer" onclick="BRANCH.setCurrent('${b.id}')">
          <span style="font-size:24px">${b.id===curId?'✅':'🏢'}</span>
          <span style="flex:1"><b style="font-size:15px">${esc(b.name)}</b><br><small style="color:var(--muted)">${typeTh(b.type)}${b.id===curId?' · กำลังใช้อยู่':''}</small></span>
        </button>`).join('')}
      </div>
      <div class="modal-f">${isOwner?'<button class="add-fab" onclick="BRANCH.manage()">⚙️ จัดการสาขา</button>':''}<button class="btn-ghost" onclick="UI.close('genOverlay')">ปิด</button></div>`;
    UI.open('genOverlay');
  }
  function setCurrent(id){
    STORE.setBid(id); renderChip(); UI.close('genOverlay');
    UI.toast('สลับเป็น '+((cur()||{}).name||'')+' แล้ว','ok');
    if(typeof NAV!=='undefined'&&NAV.cur) NAV.go(NAV.cur()); // รีเฟรชหน้าปัจจุบัน
  }
  function manage(){
    if(!AUTH.isHQ()){ UI.toast('เฉพาะผู้ดูแลระบบ (HQ)','err'); return; }
    $('#genModal').className='modal wide';
    $('#genModal').innerHTML=`
      <div class="modal-h"><h3>⚙️ จัดการสาขา</h3><button class="x" onclick="UI.close('genOverlay')">×</button></div>
      <div class="modal-b">
        <div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn-gold" onclick="BRANCH.edit('')">+ เพิ่มสาขา</button></div>
        ${list().map(b=>`<div style="display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px">
          <span style="flex:1"><b>${esc(b.name)}</b> <small style="color:var(--muted)">(${esc(b.id)} · ${typeTh(b.type)}${b.active===false?' · ปิด':''})</small>${b.ownerName?'<br><small style="color:var(--muted)">เจ้าของ: '+esc(b.ownerName)+'</small>':''}</span>
          ${(STORE.get().products||[]).filter(p=>(p.branchId||'BR-001')===b.id&&!p.deletedAt).length===0 && list().length>1?`<button class="add-fab" style="background:var(--gold)" onclick="BRANCH.clonePrompt('${b.id}')">📋 ดึงเมนูจากสาขาอื่น</button>`:''}
          <button class="add-fab" onclick="BRANCH.edit('${b.id}')">✏️ แก้</button>
        </div>`).join('')}
        <p style="font-size:12px;color:var(--muted);margin-top:6px">💡 LINE แจ้งเตือน + ราคาต่อสาขา จะเปิดใช้ในเฟสถัดไป (ตอนนี้ตั้งชื่อ/ประเภทไว้ก่อนได้)</p>

      <div class="modal-f"><button class="btn-ghost" onclick="BRANCH.switcher()">← กลับ</button></div>`;

  }
  function edit(id){
    const b=id?list().find(x=>x.id===id):null;
    UI.ask(b?'แก้สาขา':'เพิ่มสาขาใหม่',[

      else{
        let n=D.branches.length+1, newId='BR-'+String(n).padStart(3,'0');
        while(D.branches.some(x=>x.id===newId)){ n++; newId='BR-'+String(n).padStart(3,'0'); }
        const _nb={id:newId,name,type,ownerName:o.owner||'',phone:o.phone||'',lineTarget:'',priceTier:'',active:true,createdAt:STORE.now()}; D.branches.push(_nb);
        STORE.save(); CLOUD.pushItem('branches',_nb); UI.toast('เพิ่มสาขา '+name+' แล้ว','ok'); clonePrompt(newId);
      }
    });
  }
  function clonePrompt(toId){
    const others=list().filter(b=>b.id!==toId);
    if(!others.length){ manage(); return; }

/* ============================================================
   PRINT — เครื่องพิมพ์ความร้อน Bluetooth (Web Bluetooth, ESC/POS)
   รองรับ Android / คอม Chrome (iPhone ไม่รองรับ Web Bluetooth)
   ============================================================ */
const PRINT = (()=>{
  let ch=null, dev=null;
  function connected(){ return !!ch; }
  function statusText(){ return ch?('🟢 เชื่อมแล้ว'+(dev&&dev.name?' ('+dev.name+')':'')):'⚪ ยังไม่ได้เชื่อม'; }
  async function connectBT(){
    if(!(navigator&&navigator.bluetooth)){ UI.toast('เบราว์เซอร์นี้ไม่รองรับ Bluetooth (ใช้ Chrome บน Android/คอม)','err'); return; }
    try{
      dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0x18F0,0xFF00,0xFFE0,0xFEE7,'000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2']});
      const server=await dev.gatt.connect();
      const svcs=await server.getPrimaryServices();
      for(const sv of svcs){ const cs=await sv.getCharacteristics(); for(const c of cs){ if(c.properties.write||c.properties.writeWithoutResponse){ ch=c; break; } } if(ch) break; }
      if(ch){ UI.toast('เชื่อมเครื่องพิมพ์สำเร็จ ✅','ok'); } else UI.toast('ไม่พบช่องส่งข้อมูลของเครื่องพิมพ์','err');
    }catch(e){ if((e.message||'').includes('cancel')) {} else UI.toast('เชื่อมไม่สำเร็จ: '+(e.message||e),'err'); }
    if(typeof NAV!=='undefined'&&NAV.cur&&NAV.cur()==='settings') SETTINGS.render();
  }
  // แปลงไทย -> TIS-620 (เครื่องพิมพ์ไทยส่วนใหญ่ใช้โค้ดเพจนี้)
  function tis620(str){
    const out=[]; for(const chr of str){ const cp=chr.codePointAt(0);
      if(cp>=0x0E01&&cp<=0x0E5B) out.push(cp-0x0E00+0xA0);
      else if(cp<128) out.push(cp); else out.push(0x3F); }
    return out;
  }
  function build(order){
    const m=STORE.binfo(), st=STORE.get().settings, W=(st.paperWidth==='58')?32:42;
    const ESC=0x1B,GS=0x1D; let b=[];
    b.push(ESC,0x40);            // init
    b.push(ESC,0x74,0x14);       // เลือกโค้ดเพจไทย (TIS-620 / 20)
    const center=()=>b.push(ESC,0x61,0x01), left=()=>b.push(ESC,0x61,0x00);
    const ln=(t='')=>{ b=b.concat(tis620(t)); b.push(0x0A); };
    const row=(l,r)=>{ const sp=Math.max(1,W-l.length-r.length); ln(l+' '.repeat(sp)+r); };
    const dash=()=>ln('-'.repeat(W));
    center(); b.push(ESC,0x21,0x10); ln(m.shopName); b.push(ESC,0x21,0x00); // หัวตัวใหญ่
    ln(m.branchName||''); if(m.taxId) ln('เลขภาษี '+m.taxId);
    left(); dash();
    ln('เลขที่ '+order.no+(order.table?' โต๊ะ '+order.table:''));
    ln(new Date(order.createdAt).toLocaleString('th-TH'));
    dash();
    order.items.forEach(it=>{ const mt=it.mods.filter(x=>x.name!=='ปกติ').map(x=>x.name).join(','); row(it.qty+'x '+it.name, (((it.base+it.modPrice)*it.qty)/100).toLocaleString()); if(mt) ln('  +'+mt); });
    dash();
    row('รวม', (order.subtotal/100).toLocaleString());
    if(order.discount>0) row('ส่วนลด', '-'+(order.discount/100).toLocaleString());
    if(order.vat>0) row('VAT', (order.vat/100).toLocaleString());
    b.push(ESC,0x21,0x10); row('สุทธิ', (order.total/100).toLocaleString()); b.push(ESC,0x21,0x00);
    dash(); center(); ln(st.receiptFooter||'ขอบคุณค่ะ');
    b.push(0x0A,0x0A,0x0A);
    b.push(GS,0x56,0x01);        // ตัดกระดาษ
    return new Uint8Array(b);
  }
  async function escpos(order){
    if(!ch){ UI.toast('ยังไม่ได้เชื่อมเครื่องพิมพ์ Bluetooth','err'); return; }
    try{ const data=build(order); const size=180;
      for(let i=0;i<data.length;i+=size){ await ch.writeValue(data.slice(i,i+size)); }
      UI.toast('ส่งพิมพ์แล้ว','ok');
    }catch(e){ UI.toast('พิมพ์ไม่สำเร็จ: '+(e.message||e),'err'); }
  }
  async function kickDrawer(){
    if(!STORE.get().settings.autoDrawer) return false;
    if(!ch) return false;
    try{ await ch.writeValue(new Uint8Array([0x1B,0x70,0x00,0x19,0xFA])); return true; }catch(e){ return false; }
  }
  return {connectBT,connected,statusText,escpos,build,tis620,kickDrawer};
})();

    // โหมดลูกค้า: เปิดจาก QR ที่โต๊ะ (?t=T5) -> เข้าหน้าสั่งเลย ไม่ต้องใส่ PIN
    const params=new URLSearchParams(location.search);
    if(params.get('order')==='1'||params.get('t')){ const _b=params.get('b'); if(_b) STORE.setBid(_b); CUSTOMER.start(params.get('t')||''); return; }
    BRANCH.renderChip();               // แสดงสาขาปัจจุบันบน header
    POS.restoreCart();                 // คืนตะกร้าที่ค้างไว้ (ถ้ามี)
    // เตือนก่อนรีเฟรช/ปิดหน้า ถ้ายังมีรายการในตะกร้า
    window.addEventListener('beforeunload',(e)=>{ if(POS.hasCart()){ e.preventDefault(); e.returnValue=''; return ''; } });
    if(!AUTH.tryRestore()) AUTH.lock();  // รีเฟรชแล้วยังล็อกอินอยู่ (ไม่ต้องใส่ PIN ใหม่)
    setInterval(tickClock,1000);
    setInterval(()=>KDS.tick(),1000);
    setInterval(()=>{ try{ LINEN.slowScan(); }catch(e){} },60000);   // แจ้งเตือนออเดอร์ค้างครัว
    setInterval(()=>{ if(NAV.cur()==='kds') KDS.render(); },15000);
    setInterval(()=>{ PENDING.updateBadge(); if(NAV.cur()==='pending') PENDING.render(); },5000);
    bindKeys();
    // ล็อกหน้าจ ออัตโนมัติเมื่อไม่มีการใช้งานตามเวลาที่ตั้งไว้
    let lastAct=Date.now();
    ['mousedown','keydown','touchstart','click'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();},true));
    setInterval(()=>{ const t=STORE.get().settings.sessionTimeoutMin||0; if(t>0 && AUTH.get() && $('#lockScreen').classList.contains('hide') && Date.now()-lastAct>t*60000){ AUTH.lock(); UI.toast('ล็อกหน้าจ ออัตโนมัติ (ไม่ได้ใช้งาน)','ok'); } },20000);
  }
  function applyBrand(){
    const m=(STORE.get()||{}).meta||{};
    const big=esc(m.shopName||'SAO CAFE'), sub=esc(m.brandSub||'');
    const sm=sub?('<small>'+sub+'</small>'):'';
    const hl=document.getElementById('brandLogo'); if(hl) hl.innerHTML=big+sm;
    const ll=document.getElementById('lockLogo'); if(ll) ll.innerHTML=big+sm;
    try{ document.title=(m.shopName||'SAO CAFE')+' — ระบบ POS ร้านกาแฟ'; }catch(e){}
  }
  function tickClock(){ $('#clock').textContent=new Date().toLocaleTimeString('th-TH'); }
  function bindKeys(){
    document.addEventListener('keydown',(e)=>{
      // หน้า lock: พิมพ์ PIN จากคีย์บอร์ดได้เลย
      if($('#lockScreen').classList.contains('hide')===false){
        if(/^[0-9]$/.test(e.key)){ e.preventDefault(); AUTH.key(e.key,'lock'); }
        else if(e.key==='Backspace'){ e.preventDefault(); AUTH.key('⌫','lock'); }
        else if(e.key==='Escape'){ AUTH.key('C','lock'); }
        return;
      }
      // กล่องขออนุมัติ PIN ผู้จัดการ: พิมพ์จากคีย์บอร์ดได้
      if($('#pinOverlay').classList.contains('show')){
        if(/^[0-9]$/.test(e.key)){ e.preventDefault(); AUTH.key(e.key,'approve'); }
        else if(e.key==='Backspace'){ e.preventDefault(); AUTH.key('⌫','approve'); }
        else if(e.key==='Escape'){ UI.close('pinOverlay'); }
        return;
      }
      if(e.key==='Escape') $$('.overlay.show').forEach(o=>o.classList.remove('show'));
      if(e.key==='F1'){ e.preventDefault(); if(AUTH.can('pos')) NAV.go('pos'); }
      if(e.key==='F2'){ e.preventDefault(); if(AUTH.can('kds')) NAV.go('kds'); }
      if(e.key==='F3'){ e.preventDefault(); if(AUTH.can('report')) NAV.go('report'); }
      if(e.key==='Enter'&&$('#payOverlay').classList.contains('show')){ PAY.complete(); }
    });
  }
  return {init,applyBrand};
})();

document.addEventListener('DOMContentLoaded',APP.init);
/* SAO CAFE POS v2.1 — recipe editor enabled */
</script>
</body>
</html>
